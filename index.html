<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KhaiDee ຂາຍດີ — ຊື້ຂາຍອອນລາຍ</title>
<meta name="theme-color" content="#7A1E2B">
<meta name="description" content="KhaiDee ຂາຍດີ — ຊື້ງ່າຍ ໄດ້ໄວ ສົ່ງທົ່ວ ສປປ ລາວ">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KhaiDee">
<style>
:root{
  --maroon:#7A1E2B; --maroon-dark:#5A1420; --gold:#D4A94C; --gold-light:#F1DFAE;
  --cream:#FBF6EC; --ink:#2B1B14; --ink-soft:#7A6A5D; --line:#EADFCB;
  --ok:#3C7A4B; --warn:#C97A2B; --danger:#B23A3A; --white:#fff;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --shadow:0 6px 20px rgba(122,30,43,.10);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; padding:0;}
body{
  font-family:'Noto Sans Lao','Noto Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--ink);
  padding-bottom:74px;
  /* subtle app-wide backdrop: soft gold glow top-right, maroon glow bottom-left, faint dot texture */
  background-color:var(--cream);
  background-image:
    radial-gradient(circle at 100% 0%, rgba(212,169,76,.16), transparent 42%),
    radial-gradient(circle at 0% 100%, rgba(122,30,43,.08), transparent 40%),
    radial-gradient(rgba(122,30,43,.07) 1px, transparent 1px);
  background-size:auto, auto, 16px 16px;
  background-repeat:no-repeat, no-repeat, repeat;
  background-attachment:fixed, fixed, fixed;
  min-height:100vh;
}
img{max-width:100%; display:block;}
button{font-family:inherit; cursor:pointer;}

/* ---------- SPLASH SCREEN ---------- */
#splashScreen{
  position:fixed; inset:0; z-index:999; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:
    radial-gradient(circle at 20% 15%, rgba(212,169,76,.35), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(212,169,76,.25), transparent 45%),
    linear-gradient(150deg, var(--maroon) 0%, var(--maroon-dark) 65%, #3d0e17 100%);
  transition:opacity .5s ease, visibility .5s ease;
}
#splashScreen.fade-out{opacity:0; visibility:hidden; pointer-events:none;}
#splashScreen .splash-badge{
  width:132px; height:132px; border-radius:30px; background:transparent;
  display:flex; align-items:center; justify-content:center; font-size:44px; font-weight:900; color:var(--maroon);
  box-shadow:0 14px 34px rgba(0,0,0,.4); overflow:hidden;
  animation:splashPop .7s cubic-bezier(.2,1.4,.4,1) both;
}
#splashScreen .splash-badge img{width:100%; height:100%; object-fit:cover;}
@keyframes splashPop{0%{transform:scale(.4) rotate(-8deg); opacity:0;} 100%{transform:scale(1) rotate(0); opacity:1;}}
#splashScreen .splash-name-en{margin-top:22px; font-size:28px; font-weight:900; color:#fff; letter-spacing:.5px; animation:splashRise .6s ease .15s both;}
#splashScreen .splash-name-lo{margin-top:2px; font-size:19px; font-weight:700; color:var(--gold); animation:splashRise .6s ease .25s both;}
#splashScreen .splash-tag{margin-top:10px; font-size:12px; color:rgba(255,255,255,.75); animation:splashRise .6s ease .35s both;}
@keyframes splashRise{from{transform:translateY(10px); opacity:0;} to{transform:translateY(0); opacity:1;}}
#splashScreen .splash-dots{margin-top:26px; display:flex; gap:6px; animation:splashRise .6s ease .45s both;}
#splashScreen .splash-dots span{width:6px; height:6px; border-radius:99px; background:var(--gold); opacity:.4; animation:splashBlink 1.1s ease infinite;}
#splashScreen .splash-dots span:nth-child(2){animation-delay:.15s;}
#splashScreen .splash-dots span:nth-child(3){animation-delay:.3s;}
@keyframes splashBlink{0%,100%{opacity:.3; transform:scale(1);} 50%{opacity:1; transform:scale(1.3);}}

/* ---------- PAGE CONTAINERS / TOP BAR (non-home pages) ---------- */
.page-topbar{
  position:sticky; top:0; z-index:35; background:linear-gradient(135deg,var(--maroon),var(--maroon-dark));
  color:#fff; padding:16px 16px 14px; font-size:17px; font-weight:800; display:flex; align-items:center; gap:8px;
}
.stamp{
  display:inline-flex; align-items:center; gap:4px; font-weight:800; font-size:10px;
  color:var(--maroon); border:1.5px solid var(--maroon); border-radius:999px; padding:2px 8px;
  letter-spacing:.5px; transform:rotate(-4deg); background:rgba(122,30,43,.05);
}

/* ---------- HEADER ---------- */
header.top{
  position:sticky; top:0; z-index:40; background:linear-gradient(135deg,var(--maroon),var(--maroon-dark));
  padding:12px 14px 10px; color:#fff;
}
.brandrow{display:flex; align-items:center; gap:10px;}
.brand-logo{width:38px; height:38px; border-radius:10px; background:var(--gold); display:flex; align-items:center; justify-content:center; font-weight:900; color:var(--maroon); font-size:18px; overflow:hidden;}
.brand-logo img{width:100%; height:100%; object-fit:cover;}
.brand-name{font-size:19px; font-weight:800; letter-spacing:.3px;}
.brand-sub{font-size:10.5px; opacity:.85; margin-top:-2px;}
.lang-switch{margin-left:auto; display:flex; background:rgba(255,255,255,.15); border-radius:999px; padding:2px;}
.lang-switch button{background:none; border:none; color:#fff; font-size:11px; padding:5px 9px; border-radius:999px; opacity:.7;}
.lang-switch button.active{background:var(--gold); color:var(--maroon-dark); opacity:1; font-weight:700;}
.searchbar{margin-top:10px; display:flex; align-items:center; gap:8px; background:#fff; border-radius:999px; padding:9px 14px;}
.searchbar input{border:none; outline:none; flex:1; font-size:14px; color:var(--ink); background:transparent;}
.searchbar svg{flex-shrink:0;}

/* ---------- CATEGORY CHIPS ---------- */
.catrow{display:flex; gap:10px; overflow-x:auto; padding:14px; scrollbar-width:none;}
.catrow::-webkit-scrollbar{display:none;}
.catchip{flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:6px; width:64px;}
.catchip .ico{width:52px; height:52px; border-radius:16px; background:#fff; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:24px; box-shadow:var(--shadow);}
.catchip.active .ico{background:var(--gold-light); border-color:var(--gold);}
.catchip span{font-size:10.5px; text-align:center; color:var(--ink-soft); line-height:1.2;}

/* ---------- BANNER ---------- */
.banner{margin:0 14px 16px; border-radius:var(--r-lg); background:linear-gradient(120deg,var(--gold-light),#fff 70%); border:1px solid var(--gold); padding:16px; position:relative; overflow:hidden;}
.banner h2{margin:0 0 4px; font-size:17px; color:var(--maroon-dark);}
.banner p{margin:0; font-size:12px; color:var(--ink-soft);}
.banner::after{content:"ຂາຍດີ"; position:absolute; right:-6px; bottom:-14px; font-size:52px; font-weight:900; color:rgba(122,30,43,.06);}

/* ---------- PRODUCT GRID ---------- */
.section-title{display:flex; align-items:center; justify-content:space-between; padding:0 14px; margin:6px 0 10px;}
.section-title h3{font-size:15px; margin:0; display:flex; align-items:center; gap:8px;}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 14px 20px;}
.card{background:#fff; border-radius:var(--r-md); overflow:hidden; box-shadow:var(--shadow); border:1px solid var(--line); position:relative;}
.card .imgwrap{aspect-ratio:1/1; background:var(--gold-light); position:relative; overflow:hidden;}
.card .imgwrap img{width:100%; height:100%; object-fit:cover;}
.card .badge-featured{position:absolute; top:6px; left:6px;}
.card .body{padding:9px 10px 11px;}
.card .name{font-size:12.5px; font-weight:600; line-height:1.3; min-height:32px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.card .price-row{display:flex; align-items:baseline; gap:6px; margin-top:6px;}
.card .price{color:var(--maroon); font-weight:800; font-size:14.5px;}
.card .compare{font-size:11px; color:var(--ink-soft); text-decoration:line-through;}
.card .meta{display:flex; justify-content:space-between; align-items:center; margin-top:4px; font-size:10.5px; color:var(--ink-soft);}
.addbtn{position:absolute; right:8px; bottom:8px; width:28px; height:28px; border-radius:999px; background:var(--maroon); color:#fff; border:none; font-size:16px; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 8px rgba(122,30,43,.4);}

/* ---------- BOTTOM NAV ---------- */
nav.bottom{position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); display:flex; z-index:50; padding:6px 0 8px; box-shadow:0 -4px 16px rgba(0,0,0,.06);}
nav.bottom button{flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--ink-soft); font-size:10px; padding:4px 0; position:relative;}
nav.bottom button.active{color:var(--maroon);}
nav.bottom .icon{font-size:19px;}
.cart-count{position:absolute; top:-2px; right:22%; background:var(--danger); color:#fff; font-size:9px; font-weight:700; border-radius:999px; min-width:15px; height:15px; display:flex; align-items:center; justify-content:center; padding:0 3px;}

/* ---------- MODAL / POPUP ---------- */
.overlay{position:fixed; inset:0; background:rgba(30,15,10,.5); z-index:100; display:none; align-items:flex-end; justify-content:center;}
.overlay.show{display:flex;}
.overlay.center{align-items:center; padding:16px;}
.sheet{background:#fff; width:100%; max-width:480px; border-radius:20px 20px 0 0; max-height:90vh; overflow-y:auto; animation:slideup .25s ease;}
.overlay.center .sheet{border-radius:20px; max-height:85vh;}
@keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-handle{width:40px; height:4px; background:var(--line); border-radius:99px; margin:10px auto 4px;}
.sheet-header{display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-bottom:1px solid var(--line);}
.sheet-header h3{margin:0; font-size:15.5px;}
.closex{background:var(--cream); border:none; width:30px; height:30px; border-radius:999px; font-size:15px; color:var(--ink-soft);}
.sheet-body{padding:16px;}

/* ---------- FORMS ---------- */
.field{margin-bottom:12px;}
.field label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
.field input, .field select, .field textarea{
  width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:var(--r-sm);
  font-size:14px; outline:none; background:#fdfcf9; font-family:inherit;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--maroon);}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.btn{display:block; width:100%; text-align:center; padding:13px; border-radius:999px; border:none; font-weight:700; font-size:14.5px;}
.btn-primary{background:var(--maroon); color:#fff;}
.btn-gold{background:var(--gold); color:var(--maroon-dark);}
.btn-ghost{background:#fff; border:1.5px solid var(--maroon); color:var(--maroon);}
.btn-sm{padding:7px 12px; font-size:12px; border-radius:8px; width:auto; display:inline-block;}
.btn-danger{background:var(--danger); color:#fff;}
.hint{font-size:11px; color:var(--ink-soft); margin-top:6px;}
.err{background:#FBEAEA; color:var(--danger); padding:9px 12px; border-radius:8px; font-size:12.5px; margin-bottom:12px;}
.ok{background:#E9F5EC; color:var(--ok); padding:9px 12px; border-radius:8px; font-size:12.5px; margin-bottom:12px;}

/* ---------- CART ---------- */
.cart-item{display:flex; gap:10px; padding:12px 0; border-bottom:1px solid var(--line);}
.cart-item img{width:60px; height:60px; border-radius:10px; object-fit:cover; background:var(--gold-light);}
.cart-item .info{flex:1;}
.cart-item .name{font-size:13px; font-weight:600;}
.cart-item .price{color:var(--maroon); font-weight:700; font-size:13px; margin-top:4px;}
.qtybox{display:flex; align-items:center; gap:8px; margin-top:6px;}
.qtybox button{width:24px; height:24px; border-radius:6px; border:1px solid var(--line); background:#fff;}
.qtybox span{font-size:13px; min-width:18px; text-align:center;}
.sumrow{display:flex; justify-content:space-between; font-size:13px; padding:6px 0; color:var(--ink-soft);}
.sumrow.total{font-size:16px; font-weight:800; color:var(--ink); border-top:1px dashed var(--line); padding-top:10px; margin-top:6px;}

/* ---------- CAROUSEL / DETAIL ---------- */
.detail-img{width:100%; aspect-ratio:1/1; background:var(--gold-light); border-radius:14px; overflow:hidden;}
.detail-img img{width:100%; height:100%; object-fit:cover;}
.qty-select{display:flex; align-items:center; gap:14px; justify-content:center; margin:14px 0;}
.qty-select button{width:36px; height:36px; border-radius:999px; border:1.5px solid var(--maroon); background:#fff; color:var(--maroon); font-size:18px;}
.qty-select span{font-size:18px; font-weight:700; min-width:26px; text-align:center;}

/* ---------- CARRIER / RADIO CARDS ---------- */
.optcard{display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:var(--r-sm); padding:11px 12px; margin-bottom:9px;}
.optcard.selected{border-color:var(--maroon); background:rgba(122,30,43,.04);}
.optcard .ico{font-size:20px;}
.optcard .t{flex:1; font-size:13px; font-weight:600;}
.optcard .p{font-size:12.5px; color:var(--maroon); font-weight:700;}

/* ---------- PROFILE / LIST ROWS ---------- */
.listrow{display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); background:#fff;}
.listrow .ico{font-size:18px; width:22px; text-align:center;}
.listrow .t{flex:1; font-size:13.5px; font-weight:600;}
.listrow .arrow{color:var(--ink-soft);}
.profile-hero{background:linear-gradient(135deg,var(--maroon),var(--maroon-dark)); color:#fff; padding:26px 18px 34px; border-radius:0 0 24px 24px;}
.walletcard{background:#fff; margin:-22px 14px 14px; border-radius:16px; box-shadow:var(--shadow); padding:16px; display:flex; align-items:center; justify-content:space-between;}

/* ---------- ADMIN ---------- */
#adminApp{display:none; min-height:100vh; background:var(--cream);}
.admin-header{background:var(--maroon-dark); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:30;}
.admin-header h2{margin:0; font-size:15px; flex:1;}
.admin-tabs{display:flex; gap:0; overflow-x:auto; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:52px; z-index:29;}
.admin-tabs button{flex-shrink:0; padding:11px 14px; background:none; border:none; font-size:12.5px; color:var(--ink-soft); font-weight:600; border-bottom:2.5px solid transparent;}
.admin-tabs button.active{color:var(--maroon); border-color:var(--maroon);}
.admin-body{padding:14px;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
.stat-card{background:#fff; border-radius:14px; padding:14px; box-shadow:var(--shadow);}
.stat-card .n{font-size:20px; font-weight:800; color:var(--maroon);}
.stat-card .l{font-size:11px; color:var(--ink-soft); margin-top:2px;}
.admin-list-item{background:#fff; border-radius:12px; padding:12px 14px; margin-bottom:10px; box-shadow:var(--shadow);}
.admin-list-item .top{display:flex; justify-content:space-between; align-items:center;}
.admin-list-item .title{font-weight:700; font-size:13.5px;}
.status-pill{font-size:10px; font-weight:700; padding:3px 9px; border-radius:999px;}
.status-pending{background:#FCEFD9; color:var(--warn);}
.status-paid, .status-approved{background:#E2F1E5; color:var(--ok);}
.status-shipping, .status-packing{background:#E1EAF7; color:#2E5FA3;}
.status-delivered{background:#E2F1E5; color:var(--ok);}
.status-cancelled, .status-rejected{background:#FBE7E7; color:var(--danger);}
.chiprow{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
.chiprow button{font-size:10.5px; padding:5px 10px; border-radius:999px; border:1px solid var(--line); background:#fff;}
.fab{position:fixed; right:16px; bottom:80px; width:50px; height:50px; border-radius:999px; background:var(--maroon); color:#fff; border:none; font-size:22px; box-shadow:0 6px 16px rgba(122,30,43,.4); z-index:20;}

.hidden{display:none !important;}
.empty{text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:13px;}
.loader{text-align:center; padding:30px; color:var(--ink-soft); font-size:13px;}
</style>
</head>
<body>

<!-- ============================================================ SPLASH SCREEN ============================================================ -->
<div id="splashScreen">
  <div class="splash-badge" id="splashLogo"><img src="logo.png" alt="KhaiDee"></div>
  <div class="splash-name-en">KhaiDee</div>
  <div class="splash-name-lo">ຂາຍດີ</div>
  <div class="splash-tag">ຊື້ງ່າຍ ໄດ້ໄວ ສົ່ງທົ່ວ ສປປ ລາວ</div>
  <div class="splash-dots"><span></span><span></span><span></span></div>
</div>

<!-- ============================================================ CUSTOMER APP ============================================================ -->
<div id="customerApp">

<!-- ---- PAGE: HOME (only page with the big sticky header/search/categories/banner) ---- -->
<div id="pageHome" class="apppage">
  <header class="top">
    <div class="brandrow">
      <div class="brand-logo" id="brandLogo"><img src="logo.png" alt="KhaiDee"></div>
      <div>
        <div class="brand-name" id="siteName">KhaiDee ຂາຍດີ</div>
        <div class="brand-sub" data-i18n="tagline">ຂາຍດີ ຊື້ງ່າຍ ໄດ້ໄວ</div>
      </div>
      <div class="lang-switch">
        <button data-lang="lo" class="active">ລາວ</button>
        <button data-lang="th">ไทย</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
    <div class="searchbar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" placeholder="ຄົ້ນຫາສິນຄ້າ..." data-i18n-ph="search_ph">
    </div>
  </header>

  <div id="catrow" class="catrow"></div>

  <div class="banner">
    <h2 data-i18n="banner_title">🔥 ໂປຣໂມຊັ່ນປະຈຳວັນ</h2>
    <p data-i18n="banner_sub">ສັ່ງເລີຍ ສົ່ງທົ່ວ ສປປ ລາວ</p>
  </div>

  <div class="section-title"><h3 id="productSectionTitle">🛍️ ສິນຄ້າທັງໝົດ</h3></div>
  <div id="productGrid" class="grid"><div class="loader">ກຳລັງໂຫລດ...</div></div>
</div>

<!-- ---- PAGE: CATEGORIES (own light top bar, no search/banner) ---- -->
<div id="pageCategories" class="apppage hidden">
  <div class="page-topbar">📂 <span data-i18n="nav_cat">ໝວດໝູ່</span></div>
  <div id="catPageChips" class="catrow" style="padding:14px 14px 6px;"></div>
  <div id="catPageGrid" class="grid"></div>
</div>

<!-- ---- PAGE: CART ---- -->
<div id="pageCart" class="apppage hidden">
  <div class="page-topbar">🛒 <span data-i18n="nav_cart">ກະຕ່າ</span></div>
  <div id="cartBody" style="padding:14px;"></div>
</div>

<!-- ---- PAGE: ORDERS ---- -->
<div id="pageOrders" class="apppage hidden">
  <div class="page-topbar">📦 <span data-i18n="nav_orders">ຄຳສັ່ງຊື້</span></div>
  <div id="ordersBody" style="padding:14px;"></div>
</div>

<!-- ---- PAGE: ACCOUNT ---- -->
<div id="pageAccount" class="apppage hidden">
  <div id="accountBody"></div>
</div>

<nav class="bottom">
  <button class="navbtn active" data-page="home"><span class="icon">🏠</span><span data-i18n="nav_home">ໜ້າຫຼັກ</span></button>
  <button class="navbtn" data-page="categories"><span class="icon">📂</span><span data-i18n="nav_cat">ໝວດໝູ່</span></button>
  <button class="navbtn" data-page="cart"><span class="icon">🛒</span><span id="cartCountWrap" style="position:relative;"><span data-i18n="nav_cart">ກະຕ່າ</span><span class="cart-count hidden" id="cartCount">0</span></span></button>
  <button class="navbtn" data-page="orders"><span class="icon">📦</span><span data-i18n="nav_orders">ຄຳສັ່ງຊື້</span></button>
  <button class="navbtn" data-page="account"><span class="icon">👤</span><span data-i18n="nav_account">ບັນຊີ</span></button>
</nav>

</div>

<!-- ============================================================ MODALS ============================================================ -->

<!-- Product Detail -->
<div class="overlay" id="modalProduct"><div class="sheet">
  <div class="sheet-handle"></div>

const SUPABASE_URL = 'https://fzxetdumhymqkfisefnq.supabase.co';
// Using the project's anon key. This key is DESIGNED to be public/client-side —
// it only grants what your Row Level Security policies + RPC functions allow.
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6eGV0ZHVtaHltcWtmaXNlZm5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMjA4OTUsImV4cCI6MjEwMTY5Njg5NX0.07r-mPOPD93_chRlmxIX7LfKU6U51TV0CUjCv2eZFhc';
const WHATSAPP_FALLBACK = '8562054966168';

const REST = SUPABASE_URL + '/rest/v1';
function sbHeaders(extra){
  return Object.assign({
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json'
  }, extra||{});
}
async function sbSelect(table, query){
  const r = await fetch(`${REST}/${table}?${query||'select=*'}`, {headers: sbHeaders()});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbRPC(fn, body){
  const r = await fetch(`${REST}/rpc/${fn}`, {method:'POST', headers: sbHeaders(), body: JSON.stringify(body||{})});
  const data = await r.json().catch(()=>null);
  if(!r.ok){
    const msg = (data && (data.message||data.hint)) || 'error';
    throw new Error(msg);
  }
  return data;
}
async function sbUpload(bucket, path, file){
  const r = await fetch(`${SUPABASE_URL}/storage/v1/object/${bucket}/${path}`, {
    method:'POST',
    headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY},
    body:file
  });
  if(!r.ok) throw new Error(await r.text());
  return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${path}`;
}

let detailQty = 1;

    <div class="detail-img"><img src="${(p.images&&p.images[0])||'https://placehold.co/400x400/F1DFAE/7A1E2B?text=KhaiDee'}"></div>

function changeDetailQty(d){ detailQty = Math.max(1, detailQty+d); document.getElementById('detailQtyLabel').textContent = detailQty; }

function pulseCart(){ const b=document.getElementById('cartCount'); b.style.transform='scale(1.4)'; setTimeout(()=>b.style.transform='scale(1)',150); }

/* ============================================================ CART ============================================================ */
function addToCart(id, qty){
  const p = STATE.products.find(x=>x.id===id); if(!p) return;
  const existing = STATE.cart.find(i=>i.product_id===id);
  if(existing) existing.qty += qty;
  else STATE.cart.push({product_id:id, name:nameFor(p), price:p.price, qty, image:(p.images&&p.images[0])||''});
  saveCart();
}
function updateCartBadge(){
  const count = STATE.cart.reduce((s,i)=>s+i.qty,0);
  const el = document.getElementById('cartCount');
  el.textContent = count; el.classList.toggle('hidden', count===0);
}
function renderCart(){
  if(!STATE.cart.length){ document.getElementById('cartBody').innerHTML = '<div class="empty">ກະຕ່າຂອງທ່ານຍັງວ່າງເປົ່າ 🛒</div>'; return; }
  const subtotal = STATE.cart.reduce((s,i)=>s+i.price*i.qty,0);
  document.getElementById('cartBody').innerHTML = STATE.cart.map((i,idx)=>`
    <div class="cart-item">
      <img src="${i.image||'https://placehold.co/60x60/F1DFAE/7A1E2B?text=KD'}">
      <div class="info">
        <div class="name">${i.name}</div>
        <div class="price">${fmtMoney(i.price)}</div>
        <div class="qtybox">
          <button onclick="cartQty(${idx},-1)">−</button><span>${i.qty}</span><button onclick="cartQty(${idx},1)">+</button>
          <button onclick="cartRemove(${idx})" style="margin-left:auto; color:var(--danger); border:none; background:none; font-size:12px;">ລຶບ</button>
        </div>
      </div>
    </div>`).join('') +
    `<div class="sumrow total"><span>ລວມທັງໝົດ</span><span>${fmtMoney(subtotal)}</span></div>
     <button class="btn btn-primary" style="margin-top:14px;" onclick="startCheckout();">ສັ່ງຊື້ ➜</button>`;
}
function cartQty(idx,d){ STATE.cart[idx].qty=Math.max(1,STATE.cart[idx].qty+d); saveCart(); renderCart(); }
function cartRemove(idx){ STATE.cart.splice(idx,1); saveCart(); renderCart(); }

/* ============================================================ AUTH ============================================================ */
function requireLogin(next){
  if(STATE.customer){ next(); return; }
  showAuth('login', next);
}
function showAuth(mode, onSuccess){
  document.getElementById('authTitle').textContent = mode==='login' ? 'ເຂົ້າສູ່ລະບົບ' : 'ສະໝັກສະມາຊິກ';
  const body = document.getElementById('authBody');
  if(mode==='login'){
    body.innerHTML = `
      <div id="authErr"></div>
      <div class="field"><label>ເບີໂທ ຫຼື ອີເມວ</label><input id="loginId" placeholder="020XXXXXXXX ຫຼື email@example.com"></div>
      <div class="field"><label>ລະຫັດຜ່ານ</label><input type="password" id="loginPw"></div>
      <button class="btn btn-primary" onclick="doLogin()">ເຂົ້າສູ່ລະບົບ</button>
      <div class="hint" style="text-align:center; margin-top:12px;">ຍັງບໍ່ມີບັນຊີ? <a href="#" onclick="event.preventDefault(); showAuth('register', arguments)">ສະໝັກເລີຍ</a></div>`;
    body.querySelector('a').onclick = (e)=>{ e.preventDefault(); showAuth('register', onSuccess); };
    body.dataset.onsuccess = 'set';
    window.__authSuccess = onSuccess;
  }else{
    body.innerHTML = `
      <div id="authErr"></div>
      <div class="field"><label>ຊື່ ແລະ ນາມສະກຸນ</label><input id="regName"></div>
      <div class="field"><label>ເບີໂທ (ສປປ ລາວ)</label><input id="regPhone" placeholder="020XXXXXXXX"></div>
      <div class="field"><label>ອີເມວ</label><input type="email" id="regEmail"></div>
      <div class="field"><label>ລະຫັດຜ່ານ</label><input type="password" id="regPw"></div>
      <button class="btn btn-primary" onclick="doRegister()">ສະໝັກສະມາຊິກ</button>
      <div class="hint" style="text-align:center; margin-top:12px;">ມີບັນຊີແລ້ວ? <a href="#" onclick="event.preventDefault();">ເຂົ້າສູ່ລະບົບ</a></div>`;
    body.querySelector('a').onclick = (e)=>{ e.preventDefault(); showAuth('login', onSuccess); };
    window.__authSuccess = onSuccess;
  }
  openModal('modalAuth');
}
async function doLogin(){
  const id = document.getElementById('loginId').value.trim();
  const pw = document.getElementById('loginPw').value;
  try{
    const c = await sbRPC('customer_login', {p_identifier:id, p_password:pw});
    STATE.customer = c; saveCustomer(); closeModal('modalAuth');
    renderAccount();
    if(window.__authSuccess) window.__authSuccess();
  }catch(e){ document.getElementById('authErr').innerHTML = `<div class="err">ເບີ ຫຼື ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ</div>`; }
}
async function doRegister(){
  const name = document.getElementById('regName').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pw = document.getElementById('regPw').value;
  if(!name||!phone||!email||pw.length<6){ document.getElementById('authErr').innerHTML = `<div class="err">ກະລຸນາປ້ອນຂໍ້ມູນໃຫ້ຄົບ (ລະຫັດຜ່ານຢ່າງໜ້ອຍ 6 ໂຕ)</div>`; return; }
  try{
    const c = await sbRPC('customer_register', {p_phone:phone, p_email:email, p_password:pw, p_full_name:name});
    STATE.customer = c; saveCustomer(); closeModal('modalAuth');
    renderAccount();
    if(window.__authSuccess) window.__authSuccess();
  }catch(e){ document.getElementById('authErr').innerHTML = `<div class="err">ເບີໂທ ຫຼື ອີເມວນີ້ຖືກໃຊ້ແລ້ວ</div>`; }
}
function logout(){ STATE.customer = null; saveCustomer(); renderAccount(); }

/* ============================================================ CHECKOUT ============================================================ */
let checkoutState = {address:null, carrier:null, coupon:null, discount:0};
function startCheckout(){
  if(!STATE.cart.length) return;

    checkoutState = {address:null, carrier:STATE.carriers[0]||null, coupon:null, discount:0};
    renderCheckout();
    openModal('modalCheckout');
  });
}
function renderCheckout(){
  const subtotal = STATE.cart.reduce((s,i)=>s+i.price*i.qty,0);
  const shipping = checkoutState.carrier ? Number(checkoutState.carrier.base_fee) : 0;
  const total = subtotal + shipping - checkoutState.discount;
  document.getElementById('checkoutBody').innerHTML = `
    <div class="field">
      <label>📍 ທີ່ຢູ່ຈັດສົ່ງ</label>
      <div class="optcard selected" style="cursor:pointer" onclick="openModal('modalAddress'); renderAddressForm();">
        <div class="ico">🏠</div>
        <div class="t">${checkoutState.address ? `${checkoutState.address.recipient_name} — ${checkoutState.address.village}, ${checkoutState.address.district}, ${checkoutState.address.province}` : 'ແຕະເພື່ອເພີ່ມທີ່ຢູ່'}</div>

function selectCarrier(id){ checkoutState.carrier = STATE.carriers.find(c=>c.id===id); renderCheckout(); }
async function applyCoupon(){
  const code = document.getElementById('couponCode').value.trim();
  if(!code) return;
  const subtotal = STATE.cart.reduce((s,i)=>s+i.price*i.qty,0);
  try{
    const res = await sbRPC('coupon_validate', {p_code:code, p_subtotal:subtotal});
    checkoutState.coupon = code; checkoutState.discount = Number(res.discount);
    renderCheckout();
  }catch(e){ document.getElementById('couponMsg').innerHTML = `<div class="err">ລະຫັດຄູປອງບໍ່ຖືກຕ້ອງ ຫຼື ໝົດອາຍຸ</div>`; }
}
async function submitOrder(){
  if(!checkoutState.address){ alert('ກະລຸນາເພີ່ມທີ່ຢູ່ຈັດສົ່ງ'); return; }
  const payment = document.getElementById('paymentMethod').value;
  const shipping = checkoutState.carrier ? Number(checkoutState.carrier.base_fee) : 0;
  try{
    const res = await sbRPC('order_create', {
      p_customer_id: STATE.customer.id,
      p_items: STATE.cart.map(i=>({product_id:i.product_id, name:i.name, price:i.price, qty:i.qty})),
      p_address: checkoutState.address,
      p_shipping_carrier_id: checkoutState.carrier ? checkoutState.carrier.id : null,
      p_shipping_fee: shipping,
      p_payment_method: payment,
      p_coupon_code: checkoutState.coupon
    });
    STATE.cart = []; saveCart();
    closeModal('modalCheckout');
    notifyWhatsApp(res.order_number, res.total);
    alert(`ສັ່ງຊື້ສຳເລັດ! ເລກທີອໍເດີ: ${res.order_number}`);
    loadProducts().then(renderProducts);
  }catch(e){ alert('ເກີດຂໍ້ຜິດພາດ: ' + e.message); }
}
function notifyWhatsApp(orderNumber, total){
  const num = (STATE.settings.whatsapp_number || WHATSAPP_FALLBACK).replace(/[^0-9]/g,'');
  const msg = encodeURIComponent(`🛍️ ອໍເດີໃໝ່ KhaiDee\nເລກທີ: ${orderNumber}\nຍອດລວມ: ${fmtMoney(total)}\nລູກຄ້າ: ${STATE.customer.full_name} (${STATE.customer.phone})`);
  window.open(`https://wa.me/${num}?text=${msg}`, '_blank');
}

/* ============================================================ NAVIGATION (real page switching, no popups) ============================================================ */
const PAGE_IDS = {home:'pageHome', categories:'pageCategories', cart:'pageCart', orders:'pageOrders', account:'pageAccount'};
function goPage(page){
  Object.entries(PAGE_IDS).forEach(([key,id])=>{
    document.getElementById(id).classList.toggle('hidden', key!==page);
  });
  document.querySelectorAll('.navbtn').forEach(b=> b.classList.toggle('active', b.dataset.page===page));
  window.scrollTo({top:0, behavior:'instant'});
}
document.querySelectorAll('.navbtn').forEach(btn=>{
  btn.onclick = ()=>{
    const page = btn.dataset.page;
    goPage(page);
    if(page==='home'){ renderProducts(); }
    else if(page==='categories'){ renderProducts(); }
    else if(page==='cart'){ renderCart(); }
    else if(page==='orders'){ showOrders(); }
    else if(page==='account'){ renderAccount(); }
  };
});

/* ============================================================ BOOT ============================================================ */
function hideSplash(){
  const splash = document.getElementById('splashScreen');
  if(splash){ splash.classList.add('fade-out'); setTimeout(()=>splash.remove(), 550); }
}
(async function init(){
  const splashStart = Date.now();
  applyI18n();
  try{
    await loadSettings();
    if(STATE.settings.logo_url){ document.getElementById('splashLogo').innerHTML = `<img src="${STATE.settings.logo_url}">`; }
    await Promise.all([loadCategories(), loadProducts(), loadCarriers()]);
    renderProducts();
    updateCartBadge();
  }catch(e){ console.warn('init failed', e); }
  // keep the splash on screen for at least ~1.1s so the animation isn't a flicker,
  // even if data loaded faster than that
  const elapsed = Date.now() - splashStart;
  setTimeout(hideSplash, Math.max(0, 1100 - elapsed));
})();

/* ---- PWA: register service worker so the app can be "Add to Home Screen"-installed ---- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* offline shell caching is a nice-to-have, ignore failures */ });
  });
}

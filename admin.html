<!DOCTYPE html>
<html lang="lo" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="google" content="notranslate">
<title>KhaiDee Admin — ຜູ້ດູແລລະບົບ</title>
<meta name="theme-color" content="#2D2A5E">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="admin-manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KhaiDee Admin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Lao:wght@400;700&family=Poppins:wght@400;600;700&family=Quicksand:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --maroon:#2D2A5E; --maroon-dark:#1B1940; --gold:#D4A94C; --gold-light:#F1DFAE;
  --cream:#FBF6EC; --ink:#2B1B14; --ink-soft:#7A6A5D; --line:#EADFCB;
  --ok:#3C7A4B; --warn:#C97A2B; --danger:#B23A3A; --white:#fff;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --shadow:0 6px 20px rgba(45,42,94,.10);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; padding:0; font-family:'Noto Sans Lao','Noto Sans',system-ui,-apple-system,'Segoe UI',sans-serif; color:var(--ink);
  padding-bottom:74px; background-color:var(--cream);
  background-image:radial-gradient(circle at 100% 0%, rgba(212,169,76,.16), transparent 42%), radial-gradient(circle at 0% 100%, rgba(44,90,160,.08), transparent 40%);
  background-repeat:no-repeat, no-repeat; min-height:100vh;}
img{max-width:100%; display:block;}
button{font-family:inherit; cursor:pointer;}
.hidden{display:none !important;}

/* ---------- INSTALL APP TUTORIAL POPUP (auto-shown on first open) ---------- */
#installTutorial{position:fixed; inset:0; z-index:130; display:none; align-items:flex-end; justify-content:center; background:rgba(43,27,20,.6); backdrop-filter:blur(1px);}
#installTutorial.show{display:flex;}
#installTutorial .sheet{
  background:var(--cream); width:100%; max-width:480px; border-radius:22px 22px 0 0;
  padding:24px 20px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
  animation:itSheetUp .35s cubic-bezier(.2,1,.3,1) both;
}
@keyframes itSheetUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
#installTutorial .it-icon{width:64px; height:64px; border-radius:18px; background:var(--gold); margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-size:30px; overflow:hidden; box-shadow:0 6px 16px rgba(44,90,160,.2);}
#installTutorial .it-icon img{width:100%; height:100%; object-fit:cover;}
#installTutorial h3{margin:0; font-size:18px; text-align:center; color:var(--maroon-dark);}
#installTutorial .it-sub{font-size:12.5px; text-align:center; color:var(--ink-soft); margin-top:4px; margin-bottom:18px;}
#installTutorial .step{display:flex; align-items:flex-start; gap:12px; margin-top:14px;}
#installTutorial .step .num{width:26px; height:26px; border-radius:999px; background:var(--gold-light); color:var(--maroon-dark); font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;}
#installTutorial .step .txt{font-size:13.5px; line-height:1.55; padding-top:2px;}
#installTutorial .share-ico, #installTutorial .dots-ico{display:inline-block;}
#installTutorial .it-primary{margin-top:20px; width:100%; background:var(--maroon); color:#fff; border:none; border-radius:999px; padding:13px; font-size:14px; font-weight:800;}
#installTutorial .it-neveragain{display:flex; align-items:center; gap:7px; justify-content:center; margin-top:16px; font-size:11.5px; color:var(--ink-soft);}
#installTutorial .it-neveragain input{width:14px; height:14px; accent-color:var(--maroon);}

/* Small persistent reminder chip for return visits after the tutorial has been dismissed once. */
#installChip{
  position:fixed; right:12px; bottom:88px; z-index:110; background:var(--maroon); color:#fff;
  border:none; border-radius:999px; padding:10px 14px; font-size:12px; font-weight:800;
  display:none; align-items:center; gap:6px; box-shadow:0 8px 20px rgba(0,0,0,.25);
}
#installChip.show{display:inline-flex;}

/* ---- Splash ---- */
/* Ported from the main site's animated splash: soft drifting blobs, twinkling sparkles,
   a pop-in logo badge, and staggered text rise — reskinned with the SELLER corner badge. */
#splashScreen{
  position:fixed; inset:0; z-index:999; display:flex; flex-direction:column; align-items:center; justify-content:center;
  overflow:hidden; color:#fff;
  background:
    radial-gradient(circle at 20% 15%, rgba(212,169,76,.30), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(212,169,76,.22), transparent 45%),
    linear-gradient(150deg, #6FA8D8 0%, #3567AC 55%, #163974 100%);
  transition:opacity .5s ease, visibility .5s ease;
}
#splashScreen.fade-out{opacity:0; visibility:hidden; pointer-events:none;}
#splashScreen .splash-blob{position:absolute; border-radius:50%; filter:blur(2px); pointer-events:none; background:radial-gradient(circle, rgba(212,169,76,.55), rgba(212,169,76,0) 70%);}
#splashScreen .splash-blob.b1{width:190px; height:190px; top:-60px; left:-50px; animation:splashBlobFloat 6s ease-in-out infinite;}
#splashScreen .splash-blob.b2{width:150px; height:150px; bottom:-40px; right:-40px; background:radial-gradient(circle, rgba(255,255,255,.35), rgba(255,255,255,0) 70%); animation:splashBlobFloat 7s ease-in-out infinite .5s;}
#splashScreen .splash-blob.b3{width:120px; height:120px; top:8%; right:-30px; background:radial-gradient(circle, rgba(255,255,255,.25), rgba(255,255,255,0) 70%); animation:splashBlobFloat 5.5s ease-in-out infinite 1s;}
#splashScreen .splash-blob.b4{width:140px; height:140px; bottom:6%; left:-40px; animation:splashBlobFloat 6.5s ease-in-out infinite 1.4s;}
@keyframes splashBlobFloat{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(14px,-14px) scale(1.08);}}
#splashScreen .splash-deco{position:absolute; font-size:20px; opacity:0; animation:splashDecoTwinkle 2.6s ease-in-out infinite;}
#splashScreen .splash-deco.d1{top:9%; left:12%; font-size:22px; animation-delay:.2s;}
#splashScreen .splash-deco.d2{top:14%; right:14%; font-size:18px; animation-delay:1s;}
#splashScreen .splash-deco.d3{bottom:12%; left:16%; font-size:18px; animation-delay:1.6s;}
#splashScreen .splash-deco.d4{bottom:16%; right:12%; font-size:24px; animation-delay:.6s;}
@keyframes splashDecoTwinkle{0%,100%{opacity:0; transform:translateY(0) scale(.7) rotate(0deg);} 15%{opacity:.9; transform:translateY(-4px) scale(1) rotate(-6deg);} 85%{opacity:.9;} 100%{opacity:0; transform:translateY(-10px) scale(.8) rotate(6deg);}}
#splashScreen .badge{position:absolute; top:14px; right:14px; z-index:2; font-size:10px; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.4); padding:4px 10px; border-radius:999px;}
#splashScreen .logo{position:relative; z-index:2; width:132px; height:132px; border-radius:30px; background:var(--gold); display:flex; align-items:center; justify-content:center; font-size:44px; font-weight:900; color:var(--maroon); box-shadow:0 14px 34px rgba(10,30,70,.45); overflow:hidden; animation:splashPop .7s cubic-bezier(.2,1.4,.4,1) both;}
#splashScreen .logo img{width:100%; height:100%; object-fit:cover;}
@keyframes splashPop{0%{transform:scale(.4) rotate(-8deg); opacity:0;} 100%{transform:scale(1) rotate(0); opacity:1;}}
#splashScreen .splash-name-en{position:relative; z-index:2; margin-top:22px; font-size:28px; font-weight:900; color:#fff; letter-spacing:.5px; animation:splashRise .6s ease .15s both;}
#splashScreen .splash-name-lo{position:relative; z-index:2; margin-top:2px; font-size:19px; font-weight:700; color:var(--gold); animation:splashRise .6s ease .25s both;}
#splashScreen .tag{position:relative; z-index:2; margin-top:10px; font-size:12px; color:rgba(255,255,255,.8); letter-spacing:.5px; animation:splashRise .6s ease .35s both;}
@keyframes splashRise{from{transform:translateY(10px); opacity:0;} to{transform:translateY(0); opacity:1;}}
#splashScreen .splash-dots{position:relative; z-index:2; margin-top:26px; display:flex; gap:6px; animation:splashRise .6s ease .45s both;}
#splashScreen .splash-dots span{width:6px; height:6px; border-radius:99px; background:var(--gold); opacity:.4; animation:splashBlink 1.1s ease infinite;}
#splashScreen .splash-dots span:nth-child(2){animation-delay:.15s;}
#splashScreen .splash-dots span:nth-child(3){animation-delay:.3s;}
@keyframes splashBlink{0%,100%{opacity:.3; transform:scale(1);} 50%{opacity:1; transform:scale(1.3);}}

/* ---- Header ---- */
header.top{background:linear-gradient(135deg,var(--maroon),var(--maroon-dark)); padding:14px 16px 12px; color:#fff; position:sticky; top:0; z-index:40;}
.brandrow{display:flex; align-items:center; gap:10px;}
.brand-logo{width:36px; height:36px; border-radius:10px; background:var(--gold); display:flex; align-items:center; justify-content:center; font-weight:900; color:var(--maroon); font-size:16px; flex-shrink:0; overflow:hidden;}
.brand-logo img{width:100%; height:100%; object-fit:cover;}
.brand-name{font-size:15px; font-weight:800;}
.brand-sub{font-size:10.5px; opacity:.85;}
.seller-tag{margin-left:auto; font-size:9.5px; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.35); padding:3px 9px; border-radius:999px; white-space:nowrap;}

.page-topbar{padding:14px 16px 4px; font-size:15px; font-weight:800; display:flex; align-items:center; gap:6px;}

/* ---- Cards / lists (reused KhaiDee admin look) ---- */
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:14px;}
.stat-card{background:#fff; border-radius:14px; padding:14px; box-shadow:var(--shadow);}
.stat-card .n{font-size:20px; font-weight:800; color:var(--maroon);}
.stat-card .l{font-size:11px; color:var(--ink-soft); margin-top:2px;}
.admin-list-item{background:#fff; border-radius:12px; padding:12px 14px; margin:0 14px 10px; box-shadow:var(--shadow);}
/* ---------- COUPON TICKET (visual coupon card, matches the admin's designer) ---------- */
.coupon-ticket{position:relative; display:flex; align-items:stretch; min-height:88px; border-radius:16px; overflow:hidden; box-shadow:0 8px 18px rgba(0,0,0,.16); color:#fff; margin-bottom:12px;}
.coupon-ticket .ct-main{flex:1; padding:12px 14px; display:flex; flex-direction:column; justify-content:center; gap:2px; min-width:0;
  background-image:linear-gradient(135deg, var(--maroon), var(--maroon-dark)), repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 10px, transparent 10px 20px);}
.coupon-ticket.type-free .ct-main{background-image:linear-gradient(135deg, #12938A, #0B5C55), repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 10px, transparent 10px 20px);}
.coupon-ticket .ct-value{font-size:24px; font-weight:900; line-height:1.1;}
.coupon-ticket .ct-label{font-size:11.5px; font-weight:700; opacity:.95;}
.coupon-ticket .ct-sub{font-size:10px; opacity:.85; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.coupon-ticket .ct-stub{width:82px; flex-shrink:0; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; text-align:center; padding:8px 4px;
  border-left:2px dashed rgba(255,255,255,.55);
  background-image:linear-gradient(160deg, var(--gold), #B9862C);}
.coupon-ticket.type-free .ct-stub{background-image:linear-gradient(160deg, #1FC0AE, #0B5C55);}
.coupon-ticket .ct-stub::before, .coupon-ticket .ct-stub::after{content:''; position:absolute; width:16px; height:16px; border-radius:50%; background:rgba(0,0,0,.20); left:-9px;}
.coupon-ticket .ct-stub::before{top:-8px;}
.coupon-ticket .ct-stub::after{bottom:-8px;}
.coupon-ticket .ct-icon{font-size:20px;}
.coupon-ticket .ct-code{font-size:10.5px; font-weight:800; letter-spacing:.5px; word-break:break-all;}
.coupon-ticket .ct-expiry{font-size:9.5px; opacity:.9;}
.coupon-ticket .ct-actionbar{position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:flex-end; padding:0;}
.coupon-attach-row{display:flex; gap:8px; padding:0 0 12px;}
.coupon-attach-row select, .coupon-attach-row input{flex:1; padding:9px 10px; border:1.5px solid var(--line); border-radius:8px; font-size:12.5px; font-family:inherit;}
.ct-mini-btn{background:#fff; color:var(--maroon); border:none; border-radius:999px; padding:6px 12px; font-size:11px; font-weight:800; margin:8px; align-self:flex-end;}
.admin-list-item .top{display:flex; justify-content:space-between; align-items:center;}
.admin-list-item .title{font-weight:700; font-size:13.5px;}
.hint{font-size:11.5px; color:var(--ink-soft); margin:2px 0;}
.status-pill{font-size:10px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--gold-light); color:var(--maroon-dark);}
/* Admin-granted "trusted seller" mark — shown to the seller themself so they know they've
   received it; the customer-facing version of this same badge lives in index.html. */
.verified-store-badge{
  display:inline-flex; align-items:center; gap:3px; font-size:9.5px; font-weight:800; color:#fff;
  background:linear-gradient(135deg,var(--gold),#B9862E); padding:2.5px 7px; border-radius:6px;
  letter-spacing:.2px; white-space:nowrap; box-shadow:0 1px 3px rgba(0,0,0,.15); margin-left:6px;
}
.status-delivered{background:#E9F5EC; color:var(--ok);}
.status-cancelled{background:#FBEAEA; color:var(--danger);}
.status-shipping{background:#FFF3E0; color:var(--warn);}
.status-arrived{background:#FDEBD3; color:#B9691A;}
.chiprow{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
.chiprow button{font-size:10.5px; padding:5px 10px; border-radius:999px; border:1px solid var(--line); background:#fff;}
.chiprow button.active{background:var(--maroon); color:#fff; border-color:var(--maroon); font-weight:700;}
.empty,.loader{text-align:center; color:var(--ink-soft); font-size:13px; padding:30px 10px;}

/* ---- Forms ---- */
.field{margin-bottom:12px;}
.field label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
.field input, .field select, .field textarea{width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:var(--r-sm); font-size:13.5px; font-family:inherit; background:#fff; color:var(--ink);}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--maroon);}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.btn{display:block; width:100%; text-align:center; padding:13px; border-radius:999px; border:none; font-weight:700; font-size:14.5px;}
.btn-primary{background:var(--maroon); color:#fff;}
.btn-gold{background:var(--gold); color:var(--maroon-dark);}
.btn-ghost{background:#fff; border:1.5px solid var(--maroon); color:var(--maroon);}
.btn-sm{padding:7px 12px; font-size:12px; border-radius:8px; width:auto; display:inline-block;}
.err{background:#FBEAEA; color:var(--danger); padding:9px 12px; border-radius:8px; font-size:12.5px; margin-bottom:12px;}

/* ---- Bottom nav ---- */
nav.bottom{position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); display:flex; z-index:50; padding:6px 0 8px; box-shadow:0 -4px 16px rgba(0,0,0,.06);}
nav.bottom button{flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--ink-soft); font-size:10px; padding:4px 0;}
nav.bottom button.active{color:var(--maroon); font-weight:700;}
nav.bottom .icon{font-size:19px;}

/* ---- Overlays / sheets (reused pattern) ---- */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s;}
.overlay.show{opacity:1; pointer-events:auto;}
.overlay.center{align-items:center;}
.sheet{background:#fff; width:100%; max-width:480px; border-radius:20px 20px 0 0; max-height:90vh; overflow-y:auto;}
.overlay.center .sheet{border-radius:20px; max-height:85vh; margin:0 16px;}
.sheet-header{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line);}
.sheet-header h3{margin:0; font-size:15px;}
.sheet-body{padding:16px;}
.closex{background:var(--cream); border:none; width:30px; height:30px; border-radius:999px; font-size:15px; color:var(--ink-soft);}

.fab{position:fixed; right:16px; bottom:80px; width:50px; height:50px; border-radius:999px; background:var(--maroon); color:#fff; border:none; font-size:22px; box-shadow:0 6px 16px rgba(44,90,160,.4); z-index:20;}

/* ---- Seller application (KYC) ---- */
.status-pending{background:var(--gold-light); color:var(--maroon-dark);}
.status-approved{background:#E9F5EC; color:var(--ok);}
.status-rejected{background:#FBEAEA; color:var(--danger);}
.wa-connect-box{display:flex; align-items:center; gap:8px; margin:-4px 0 12px;}
.wa-connect-box .hint{margin:0;}
#sRegIdPreview img{width:100%; max-width:220px; border-radius:10px; border:1.5px solid var(--line); margin-top:6px;}
#sRegQrPreview img{width:120px; border-radius:10px; border:1.5px solid var(--line); margin-top:6px;}
.pending-icon{width:64px; height:64px; border-radius:50%; background:var(--gold-light); display:flex; align-items:center; justify-content:center; font-size:28px; margin:4px auto 14px;}

/* ---- Login screen ---- */
#authScreen{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;}
#authScreen .logo{width:70px; height:70px; border-radius:18px; background:var(--gold); display:flex; align-items:center; justify-content:center; font-weight:900; color:var(--maroon); font-size:26px; margin-bottom:12px;}
#authScreen .card{width:100%; max-width:360px; background:#fff; border-radius:18px; padding:22px 20px; box-shadow:var(--shadow);}
#authScreen h2{margin:0 0 4px; font-size:17px; text-align:center;}
#authScreen .sub{text-align:center; font-size:12px; color:var(--ink-soft); margin-bottom:18px;}
#pinLockScreen{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; background:var(--cream);}
#pinLockScreen .logo{width:70px; height:70px; border-radius:18px; background:var(--gold); display:flex; align-items:center; justify-content:center; font-weight:900; color:var(--maroon); font-size:26px; margin-bottom:12px; overflow:hidden;}
#pinLockScreen .logo img{width:100%; height:100%; object-fit:cover;}
#pinLockScreen .card{width:100%; max-width:360px; background:#fff; border-radius:18px; padding:22px 20px; box-shadow:var(--shadow);}
#pinLockScreen h2{margin:0 0 4px; font-size:17px;}
#pinLockScreen .sub{font-size:12px; color:var(--ink-soft);}
.pin-dot{width:14px; height:14px; border-radius:50%; border:1.5px solid var(--maroon); background:transparent; transition:background .15s;}
.pin-dot.filled{background:var(--maroon);}
.pin-key{font-size:20px; font-weight:700; padding:16px 0; border-radius:14px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer;}
.pin-key:active{background:var(--cream);}
#pinBackspace{font-size:17px;}
@keyframes pinShake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(8px);} 60%{transform:translateX(-6px);} 80%{transform:translateX(6px);} }

/* ---- Custom in-app toast (replaces the browser's native showToast() popup so success/error
   messages always look like part of the app, not a Safari/Chrome system dialog) ---- */
#toastStack{position:fixed; left:0; right:0; top:calc(env(safe-area-inset-top,0px) + 14px); z-index:9999;
  display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; padding:0 16px;}
.toast{
  max-width:420px; width:100%; background:#fff; border-radius:14px; padding:12px 14px; display:flex; align-items:flex-start; gap:10px;
  box-shadow:0 10px 30px rgba(43,27,20,.22); border-left:4px solid var(--maroon); pointer-events:auto;
  transform:translateY(-18px); opacity:0; transition:transform .25s ease, opacity .25s ease; font-size:13px; line-height:1.5; color:var(--ink);
}
.toast.show{transform:translateY(0); opacity:1;}
.toast .ic{font-size:17px; flex-shrink:0; margin-top:1px;}
.toast .msg{flex:1; white-space:pre-line; word-break:break-word;}
.toast .x{background:none; border:none; color:var(--ink-soft); font-size:13px; padding:2px 0 0 4px; flex-shrink:0; line-height:1;}
.toast.success{border-left-color:var(--ok);}
.toast.error{border-left-color:var(--danger);}
.toast.warn{border-left-color:var(--warn);}
.toast.info{border-left-color:var(--gold);}

/* ---------- ADMIN APP SHELL ---------- */
#loginScreen{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; background:linear-gradient(160deg, var(--maroon), var(--maroon-dark));}
#loginScreen .login-card{background:#fff; border-radius:20px; padding:28px 22px; width:100%; max-width:360px; box-shadow:0 20px 50px rgba(0,0,0,.3);}
#loginScreen .login-logo{width:64px; height:64px; border-radius:16px; background:var(--gold); display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 14px; overflow:hidden; box-shadow:0 8px 20px rgba(0,0,0,.2);}
#loginScreen .login-logo img{width:100%; height:100%; object-fit:cover;}
#loginScreen h2{text-align:center; margin:0 0 4px; font-size:17px; color:var(--maroon-dark);}

<script>
/* ============================================================ TOAST NOTIFICATIONS ============================================================ */
function showToast(message, type){
  if(!type){
    const t = String(message||'');
    if(/ຜິດພາດ|ບໍ່ສຳເລັດ|ບໍ່ຖືກຕ້ອງ|ໝົດອາຍຸ|ໝົດແລ້ວ|ບໍ່ພຽງພໍ|ໃຫຍ່ເກີນໄປ|ຍາວເກີນໄປ|ບໍ່ພົບ|ບໍ່ສາມາດ/.test(t)) type = 'error';
    else if(/ກະລຸນາ/.test(t)) type = 'warn';
    else type = 'success';
  }
  const stack = document.getElementById('toastStack');
  if(!stack){ window.alert(message); return; }
  const icons = {success:'✅', error:'❌', warn:'⚠️', info:'ℹ️'};
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<span class="ic">${icons[type]||icons.info}</span><span class="msg"></span><button class="x" aria-label="close">✕</button>`;
  el.querySelector('.msg').textContent = message;
  stack.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  const remove = ()=>{ el.classList.remove('show'); setTimeout(()=> el.remove(), 250); };
  const timer = setTimeout(remove, type==='error' ? 4200 : 3200);
  el.querySelector('.x').onclick = ()=>{ clearTimeout(timer); remove(); };
}

/* ============================================================ CONFIG — same Supabase project as
   the customer site & seller app, so all three share one backend. ============================================================ */
const SUPABASE_URL = 'https://fzxetdumhymqkfisefnq.supabase.co';

const REST = SUPABASE_URL + '/rest/v1';
function sbHeaders(extra){ return Object.assign({'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json'}, extra||{}); }
async function sbSelect(table, query){ const r=await fetch(`${REST}/${table}?${query||'select=*'}`,{headers:sbHeaders()}); if(!r.ok) throw new Error(await r.text()); return r.json(); }
async function sbRPC(fn, body){
  const r = await fetch(`${REST}/rpc/${fn}`,{method:'POST', headers:sbHeaders(), body:JSON.stringify(body||{})});
  const data = await r.json().catch(()=>null);
  if(!r.ok){ throw new Error((data&&(data.message||data.hint))||'error'); }
  return data;
}
async function sbUpload(bucket, path, file){
  const r = await fetch(`${SUPABASE_URL}/storage/v1/object/${bucket}/${path}`,{method:'POST', headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}, body:file});
  if(!r.ok) throw new Error(await r.text());

/* ============================================================ RAPID-TAP GUARD ============================================================ */
const _inFlightActions = new Set();
async function onGuard(key, fn){
  if(_inFlightActions.has(key)) return;
  _inFlightActions.add(key);
  try{ await fn(); } finally{ _inFlightActions.delete(key); }
}

/* ============================================================ UI SOUND FEEDBACK ============================================================ */
let _audioCtx = null;
function _getAudioCtx(){
  try{
    if(!_audioCtx) _audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(_audioCtx.state==='suspended') _audioCtx.resume().catch(()=>{});
    return _audioCtx;
  }catch(e){ return null; }
}
function _tone(ctx, freq, startTime, duration, gain){
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = 'sine'; osc.frequency.value = freq;
  g.gain.setValueAtTime(0, startTime);
  g.gain.linearRampToValueAtTime(gain, startTime+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, startTime+duration);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(startTime); osc.stop(startTime+duration);
}
function playSuccessSound(){
  const ctx = _getAudioCtx(); if(!ctx) return;
  const t = ctx.currentTime;
  _tone(ctx, 880, t, 0.12, 0.15);
  _tone(ctx, 1318.5, t+0.09, 0.18, 0.15);
  vibrate(30);
}
function playErrorSound(){
  const ctx = _getAudioCtx(); if(!ctx) return;
  const t = ctx.currentTime;
  _tone(ctx, 220, t, 0.2, 0.12);
  vibrate([25,40,25]);
}
function vibrate(pattern){ try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }

function openModal(id){ const el=document.getElementById(id); if(el) el.classList.add('show'); }
function closeModal(id){ const el=document.getElementById(id); if(el) el.classList.remove('show'); }

let STATE = {
  adminPassword: localStorage.getItem('kd_admin_pw') || null,
  settings: {}, categories: [], products: [], carriers: [], sellers: []

/* ---- Applies the admin-controlled branding/theme settings (site_settings_public) to THIS app's
   CSS variables. Reads "admin_theme_*" keys first (set below, in the ຮູບແບບ/ສີ tab), falls back
   to the shared legacy theme_primary/theme_accent keys, then to this app's own default. Mirrors
   the identical function in index.html / seller.html so all three apps use one settings schema. ---- */
function applyThemeSettings(prefix, fallback){
  const s = STATE.settings, root = document.documentElement.style;
  const pick = (suffix, fb) => s[prefix+'_theme_'+suffix] || (suffix==='primary'||suffix==='accent' ? s['theme_'+suffix] : null) || fb;
  const primary = pick('primary', fallback.primary);
  const primaryDark = pick('primary_dark', fallback.primaryDark);
  const accent = pick('accent', fallback.accent);
  const accentLight = pick('accent_light', fallback.accentLight);
  const bg = pick('bg', fallback.bg);
  const ink = pick('ink', fallback.ink);
  if(primary) root.setProperty('--maroon', primary);
  if(primaryDark) root.setProperty('--maroon-dark', primaryDark);
  if(accent) root.setProperty('--gold', accent);
  if(accentLight) root.setProperty('--gold-light', accentLight);
  if(bg) root.setProperty('--cream', bg);
  if(ink) root.setProperty('--ink', ink);
  if(s.theme_font_family){ document.body.style.fontFamily = `'${s.theme_font_family}','Noto Sans Lao','Noto Sans',system-ui,-apple-system,'Segoe UI',sans-serif`; }
  if(s.theme_radius_scale){
    const sc = Number(s.theme_radius_scale) || 1;
    root.setProperty('--r-lg', (18*sc).toFixed(1)+'px');
    root.setProperty('--r-md', (12*sc).toFixed(1)+'px');
    root.setProperty('--r-sm', (8*sc).toFixed(1)+'px');
  }
}
const ADMIN_THEME_DEFAULT = {primary:'#2D2A5E', primaryDark:'#1B1940', accent:'#D4A94C', accentLight:'#F1DFAE', bg:'#FBF6EC', ink:'#2B1B14'};
const APP_THEME_DEFAULTS = {

const OFFICIAL_STORE_SELLER_PHONE = '02054966168';
let OFFICIAL_STORE_SELLER_ID = null; // resolved lazily via admin_list_sellers (has phone; sellers_list_public doesn't)
async function resolveOfficialStoreSellerId(){
  if(OFFICIAL_STORE_SELLER_ID) return OFFICIAL_STORE_SELLER_ID;

function fmtCountdown(expiresAt){
  if(!expiresAt) return '';
  const diff = new Date(expiresAt).getTime() - Date.now();
  if(diff<=0) return 'ໝົດອາຍຸແລ້ວ';
  const d = Math.floor(diff/86400000), h = Math.floor(diff%86400000/3600000), m = Math.floor(diff%3600000/60000), s = Math.floor(diff%60000/1000);
  if(d>0) return `${d}ມື້ ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function estimateDeliveryTargetIso(order){
  if(order.estimated_delivery_date) return order.estimated_delivery_date;
  if(order.estimated_delivery_days && order.shipped_at){
    const d = new Date(order.shipped_at);
    d.setDate(d.getDate() + Number(order.estimated_delivery_days));
    return d.toISOString();
  }
  if(!order.carrier_name || !order.created_at) return null;
  const carrier = STATE.carriers.find(c=>c.name===order.carrier_name);
  const days = carrier ? Number(carrier.avg_delivery_days||3) : 3;
  const d = new Date(order.created_at);
  d.setDate(d.getDate() + days);
  return d.toISOString();
}
function estimateDeliveryDate(order){
  const iso = estimateDeliveryTargetIso(order);
  if(!iso) return null;
  return new Date(iso).toLocaleDateString('lo-LA', {day:'numeric', month:'long', year:'numeric'});
}
function deliveryCountdownHtml(order){
  if(order.status!=='shipping') return '';
  const iso = estimateDeliveryTargetIso(order);
  if(!iso) return '';
  return `<div class="hint" style="margin-top:4px; font-weight:700; color:var(--ok);">🚚 ຄາດວ່າຈະຮອດໃນ <span class="delivery-cd" data-expires="${iso}">${fmtCountdown(iso)}</span></div>`;
}
setInterval(()=>{
  document.querySelectorAll('.delivery-cd, .coupon-cd').forEach(el=>{
    const exp = el.getAttribute('data-expires'); if(!exp) return;
    el.textContent = fmtCountdown(exp);
  });
}, 1000);
function fmtMoney(n){ return (STATE.settings.currency||'₭') + ' ' + Number(n||0).toLocaleString('en-US'); }
// Generic "big table" renderer shared by orders/products/customers/topups/withdrawals/banks/
// coupons/ads/returns/theme — headers is an array of column label strings, rows is an array of
// {onClick: 'jsExprString', cells: ['<td-inner-html>', ...]}. Row click opens the same detail
// modal each section already had before switching from tiles/cards to a table; nothing about
// how a row is *edited* changed, only how the list is laid out.
function dtable(headers, rows, emptyMsg){
  if(!rows.length) return `<div class="empty">${emptyMsg||'ບໍ່ມີລາຍການ'}</div>`;
  return `<div class="dtable-wrap"><table class="dtable">
    <thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr onclick="${r.onClick}">${r.cells.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

/* ---- Chart.js dashboard visuals. All charts read the same live theme colors (--maroon/--gold)
   so they automatically match whatever branding is set in the ຮູບແບບ/ສີ tab — no separate
   "chart color" setting needed. Chart instances are destroyed on every re-render (canvas gets a
   fresh element each time adminBody is replaced, but Chart.js keeps an internal registry keyed
   by canvas — destroying first avoids "Canvas already in use" warnings on repeat tab visits). ---- */
let _charts = {};
function _destroyChart(key){ if(_charts[key]){ try{ _charts[key].destroy(); }catch(e){} delete _charts[key]; } }
function _cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || null; }
function renderDashboardCharts(trend, topProducts, allOrders){
  if(typeof Chart==='undefined') return; // CDN blocked/offline — dashboard still works, just without charts
  const maroon = _cssVar('--maroon') || '#2D2A5E', gold = _cssVar('--gold') || '#D4A94C', ok = _cssVar('--ok') || '#3C7A4B';
  ['chartTrend','chartStatus','chartTopProducts'].forEach(_destroyChart);

  const trendCanvas = document.getElementById('chartTrend');
  if(trendCanvas){
    const labels = trend.map(t=>{ const dt=new Date(t.day); return `${dt.getDate()}/${dt.getMonth()+1}`; });
    _charts.chartTrend = new Chart(trendCanvas, {
      type:'line',
      data:{ labels, datasets:[
        {label:'ຍອດຂາຍ', data:trend.map(t=>Number(t.revenue)||0), borderColor:maroon, backgroundColor:maroon+'22', fill:true, tension:.35, yAxisID:'y', pointRadius:3},
        {label:'ຈຳນວນອໍເດີ', data:trend.map(t=>Number(t.order_count)||0), borderColor:gold, backgroundColor:gold+'22', fill:false, tension:.35, yAxisID:'y1', pointRadius:3}
      ]},
      options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index', intersect:false},
        plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{size:10}}}},
        scales:{
          y:{position:'left', ticks:{font:{size:9}, callback:v=>fmtMoney(v)}},
          y1:{position:'right', grid:{drawOnChartArea:false}, ticks:{font:{size:9}, precision:0}},
          x:{ticks:{font:{size:9}}}
        } }
    });
  }

  const statusCanvas = document.getElementById('chartStatus');
  if(statusCanvas){
    const counts = {};
    (allOrders||[]).forEach(o=> counts[o.status] = (counts[o.status]||0)+1);
    const statusColors = {pending:'#D4A94C', paid:'#8CB6E0', packing:'#2E5FA3', shipping:'#C97A2B', delivered:'#3C7A4B', cancelled:'#B23A3A', pending_verification:'#C97A2B'};
    const labels = Object.keys(counts);
    _charts.chartStatus = new Chart(statusCanvas, {
      type:'doughnut',
      data:{ labels:labels.map(orderStatusLabel), datasets:[{ data:labels.map(k=>counts[k]), backgroundColor:labels.map(k=>statusColors[k]||'#999'), borderWidth:2, borderColor:'#fff' }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{size:9.5}}}} }
    });
  }

  const topCanvas = document.getElementById('chartTopProducts');
  if(topCanvas && topProducts.length){
    _charts.chartTopProducts = new Chart(topCanvas, {
      type:'bar',
      data:{ labels:topProducts.map(p=> p.name.length>14 ? p.name.slice(0,14)+'…' : p.name), datasets:[{ label:'ຂາຍໄດ້', data:topProducts.map(p=>p.qty||0), backgroundColor:gold, borderRadius:6 }] },
      options:{ responsive:true, maintainAspectRatio:false, indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{ticks:{font:{size:9}, precision:0}}, y:{ticks:{font:{size:9.5}}}} }
    });
  }
}

// Small color dot used on compact tiles/list items across the admin panel.
function adminStatusColor(status){
  const ok = ['approved','paid','delivered','active'];
  const warn = ['pending','packing','shipping','expired_paid'];
  const bad = ['rejected','cancelled','suspended'];
  if(ok.includes(status)) return 'var(--ok)';
  if(warn.includes(status)) return 'var(--warn)';
  if(bad.includes(status)) return 'var(--danger)';
  return 'var(--ink-soft)';
}

      <div style="font-weight:700; color:var(--maroon); margin-top:4px;">${fmtMoney(o.total)}</div>

// Setting status to 'delivered' is the trigger point for releasing money to the seller: the
// admin_update_order_status RPC, when p_release_funds is true, should compute 5% platform
// commission on that order's item subtotal, credit the remaining 95% to the seller's
// wallet_balance (skip this for official-store orders where seller_id is null — that revenue
// is already the platform's own), log a seller_wallet_transactions row, and send the customer
// a notification carrying the order's fulfillment evidence photos + tracking link.
async function adminSetOrderStatus(id, status){
  onGuard('order-status-'+id, async ()=>{
    if(status==='delivered'){
      const ok = confirm('ຢືນຢັນວ່າລູກຄ້າໄດ້ຮັບເຄື່ອງແລ້ວບໍ? ລະບົບຈະໂອນເງິນເຂົ້າ Wallet ຜູ້ຂາຍ (ຫັກຄ່າທຳນຽມ 5%) ແລະ ແຈ້ງເຕືອນລູກຄ້າ');
      if(!ok) return;
    }
    try{
      await sbRPC('admin_update_order_status', {p_password:STATE.adminPassword, p_order_id:id, p_status:status});
      if(status==='delivered'){
        // Release seller payouts for this order's items that the seller has already marked
        // delivered (order_items.seller_status='delivered') and that haven't been paid out yet.
        const order = adminOrdersList.find(o=>o.id===id);
        const items = (order && order.items) || [];
        for(const it of items){
          if(it.seller_status==='delivered' && !it.payout_released){
            try{ await sbRPC('admin_release_payout', {p_password:STATE.adminPassword, p_order_item_id:it.id}); }
            catch(e){ /* not eligible yet or already released — safe to skip */ }
          }
        }
      }
      playSuccessSound(); renderAdminOrders();
    }
    catch(e){ playErrorSound(); showToast('ຜິດພາດ: ' + e.message); }
  });
}

// Needs a new admin_delete_order RPC (SECURITY DEFINER) that removes the order + its
// order_items after checking p_password. Consider only allowing this for cancelled/old
// test orders — deleting real order history can break reporting/accounting.
async function adminDeleteOrder(id){
  if(!confirm('ລຶບອໍເດີນີ້ຖາວອນ? ຂໍ້ມູນຈະຫາຍໄປທັງໝົດ')) return;
  onGuard('delete-order-'+id, async ()=>{
    try{
      await sbRPC('admin_delete_order', {p_password:STATE.adminPassword, p_order_id:id});
      adminOrdersList = adminOrdersList.filter(o=>o.id!==id); // drop it locally right away so it can't appear "stuck"
      paintAdminOrders();
      playSuccessSound();
      // then re-sync with the server — if the row is still there after this, the delete RPC
      // itself isn't removing it server-side (see comment above) and needs to be fixed in Supabase.
      renderAdminOrders();
    }
    catch(e){
      playErrorSound();
      // Common cause: notifications.order_id has a FOREIGN KEY to orders.id without ON DELETE
      // CASCADE, so Postgres blocks the delete while a notification still points at this order.
      // Fix is a one-time SQL change in Supabase (not something the client can patch around):
      //   ALTER TABLE public.notifications DROP CONSTRAINT notifications_order_id_fkey;
      //   ALTER TABLE public.notifications ADD CONSTRAINT notifications_order_id_fkey
      //     FOREIGN KEY (order_id) REFERENCES public.orders(id) ON DELETE CASCADE;
      // (use ON DELETE SET NULL instead of CASCADE if old notifications should be kept around
      // with order_id cleared rather than deleted along with the order.)
      if(/foreign key constraint/i.test(e.message) && /notifications/i.test(e.message)){
        showToast('ລຶບບໍ່ສຳເລັດ: ອໍເດີນີ້ຍັງມີການແຈ້ງເຕືອນ (notifications) ຄ້າງອ້າງອີງຢູ່ — ຕ້ອງແກ້ໄຂ foreign key ຂອງຕາຕະລາງ notifications ໃນ Supabase (ON DELETE CASCADE) ກ່ອນຈຶ່ງລຶບໄດ້');
      }else{
        showToast('ລຶບບໍ່ສຳເລັດ: ' + e.message);
      }
    }
  });
}

function toggleGroupPreset(i, presetValue){

function addCustomGroupValue(i, text){

    const ok = confirm(`"${priceLooking.join(', ')}" ຄືຕົວເລກຄ້າຍລາຄາ ບໍ່ຄືຊື່ຕົວເລືອກ (ເຊັ່ນ ສີ/ໄຊສ໌) — ຢືນຢັນວ່າຕ້ອງການໃຊ້ຄ່ານີ້ແທ້ບໍ?`);
    if(!ok) return;

  const g = pGroups[i]; g.values = g.values || [];

function cartesian(arrs){
  return arrs.reduce((acc,cur)=> acc.flatMap(a=>cur.map(c=>[...a,c])), [[]]);
}
function rebuildVariants(){
  const validGroups = pGroups.filter(g=>g.name && g.values && g.values.length);
  if(!validGroups.length){ pVariants = []; renderVariantsBox(); return; }
  const combos = cartesian(validGroups.map(g=>g.values.map(v=>v.value)));
  const basePrice = Number(document.getElementById('pPrice')?.value)||0;
  const baseStock = Number(document.getElementById('pStock')?.value)||0;
  pVariants = combos.map(labels=>{
    const existing = pVariants.find(v=> JSON.stringify(v.value_labels)===JSON.stringify(labels));
    return existing || {value_labels:labels, price:basePrice, compare_price:null, stock:baseStock, sku:''};
  });
  renderVariantsBox();
}
function renderVariantsBox(){
  const box = document.getElementById('pVariantsBox');
  if(!box) return;
  if(!pVariants.length){ box.innerHTML=''; syncProductStockFromVariants(); return; }
  box.innerHTML = `<table style="width:100%; border-collapse:collapse; font-size:12px;">
    <tr style="text-align:left; color:var(--ink-soft);"><th style="padding:4px;">ຕົວເລືອກ</th><th style="padding:4px;">ລາຄາ</th><th style="padding:4px;">ສະຕັອກ</th></tr>
    ${pVariants.map((v,i)=>`<tr>
      <td style="padding:4px; font-weight:600;">${v.value_labels.join(' / ')}</td>
      <td style="padding:4px;"><input type="number" value="${v.price??''}" style="width:80px; padding:5px; border:1px solid var(--line); border-radius:6px;" oninput="pVariants[${i}].price=Number(this.value)||0"></td>
      <td style="padding:4px;"><input type="number" value="${v.stock??0}" style="width:60px; padding:5px; border:1px solid var(--line); border-radius:6px;" oninput="pVariants[${i}].stock=Number(this.value)||0; syncProductStockFromVariants();"></td>
    </tr>`).join('')}
  </table>`;
  syncProductStockFromVariants();
}
// Each color/size can sell out at a different rate, so stock is tracked per-variant. The
// product's overall "ຈຳນວນສະຕັອກ" field is then just the sum of those — no separate manual
// total to keep in sync by hand.
function syncProductStockFromVariants(){
  const stockInput = document.getElementById('pStock');
  const hint = document.getElementById('pStockHint');
  if(!stockInput) return;
  if(pVariants.length){
    const total = pVariants.reduce((sum,v)=> sum + (Number(v.stock)||0), 0);
    stockInput.value = total;
    stockInput.readOnly = true;
    stockInput.style.background = 'var(--line)';
    if(hint) hint.textContent = `🔒 ຄິດໄລ່ອັດຕະໂນມັດ = ຜົນລວມສະຕັອກຂອງທຸກຕົວເລືອກ (${pVariants.length} ຕົວເລືອກ)`;
  }else{
    stockInput.readOnly = false;
    stockInput.style.background = '';
    if(hint) hint.textContent = '';
  }
}

    renderGroupsBox();

  const initialAdminCat = p.category_id || (STATE.categories[0] && STATE.categories[0].id);
  if(initialAdminCat) await loadCategoryAttrs(initialAdminCat);
  if(id){
    try{
      const existingVals = await sbSelect('product_attribute_values', `product_id=eq.${id}`);
      existingVals.forEach(v=> pAttrValues[v.attribute_id] = v.value);
    }catch(e){}
    try{
      const vg = await sbRPC('product_variants_get', {p_product_id: id});
      pGroups = (vg.groups||[]).map(g=>({name:g.name, values:(g.values||[]).map(v=>({value:v.value, image_url:v.image_url}))}));
      pVariants = (vg.variants||[]).map(v=>{
        const labels = (v.value_ids||[]).map(vid=>{
          for(const g of vg.groups||[]){ const found=(g.values||[]).find(x=>x.id===vid); if(found) return found.value; }
          return '';
        });
        return {value_labels:labels, price:v.price, compare_price:v.compare_price, stock:v.stock, sku:v.sku};
      });

  }

      const payload = {
        id: id||undefined, category_id: Number(document.getElementById('pCat').value),
        seller_id: document.getElementById('pSeller').value || null,
        name_lo: document.getElementById('pNameLo').value, name_th: document.getElementById('pNameTh').value,
        name_en: document.getElementById('pNameEn').value, description: document.getElementById('pDesc').value,
        price: Number(document.getElementById('pPrice').value), compare_price: Number(document.getElementById('pCompare').value)||null,
        stock: Number(document.getElementById('pStock').value),
        weight_kg: Number(document.getElementById('pWeight').value)||1,
        images: pendingImages, video_url: pendingVideoUrl,
        is_featured: document.getElementById('pFeatured').checked, is_active: document.getElementById('pActive').checked
      };
      const res = await sbRPC('admin_upsert_product', {p_password:STATE.adminPassword, p_product:payload});
      const productId = id || res.id;
      // Save category attributes
      const attrPayload = Object.entries(pAttrValues).filter(([k,v])=>v!==undefined && v!==null && String(v).trim()!=='').map(([attribute_id,value])=>({attribute_id:Number(attribute_id), value:String(value)}));
      await sbRPC('admin_product_set_attributes', {p_password:STATE.adminPassword, p_product_id: productId, p_values: attrPayload});
      // Save variant groups + variants (if any)
      const validGroups = pGroups.filter(g=>g.name && g.values && g.values.length);
      if(validGroups.length){
        await sbRPC('admin_set_product_variants', {p_password:STATE.adminPassword, p_product_id: productId,
          p_groups: validGroups.map(g=>({name:g.name, values:g.values})), p_variants: pVariants});
      }
      overlay.remove(); renderAdminProducts();
    }catch(e){
      showToast('ບັນທຶກບໍ່ສຳເລັດ: ' + e.message);
      btn.disabled = false; btn.textContent = 'ບັນທຶກ';
    }
  };
}
/* ---- AI-assisted product description ----
   Calls the Google Gemini API (generativelanguage.googleapis.com) directly from the admin's
   browser using the free-tier key saved in Settings ► AI ຂຽນລາຍລະອຽດສິນຄ້າ, so the admin
   doesn't have to hand-write every listing. Gemini's free tier (get a key at ai.google.dev, no
   credit card needed) resets daily and is plenty for occasional product-description writing.
   Note: this keeps the key on the client (admin panel only) for simplicity — fine as long as
   admin access itself stays private; for a public multi-admin setup this should eventually
   move behind a small server-side proxy instead of calling the API straight from the browser. */
async function generateProductDescription(overlay){
  const key = STATE.settings.gemini_api_key;
  if(!key){ showToast('ກະລຸນາຕັ້ງຄ່າ Gemini API Key ໃນໜ້າ "ການຕັ້ງຄ່າ" ກ່ອນ'); return; }
  const nameLo = overlay.querySelector('#pNameLo').value.trim();
  if(!nameLo){ showToast('ກະລຸນາພິມຊື່ສິນຄ້າ (ພາສາລາວ) ກ່ອນ ເພື່ອໃຫ້ AI ຮູ້ວ່າຈະຂຽນລາຍລະອຽດຫຍັງ'); return; }
  const catId = Number(overlay.querySelector('#pCat').value);
  const catName = (STATE.categories.find(c=>c.id===catId)||{}).name_lo || '';
  const price = overlay.querySelector('#pPrice').value;
  const btn = overlay.querySelector('#pAiDescBtn');
  btn.disabled = true; btn.textContent = '⏳ ກຳລັງຂຽນ...';
  try{
    const prompt = `ຂຽນລາຍລະອຽດສິນຄ້າສຳລັບຮ້ານຄ້າອອນລາຍ ເປັນພາສາລາວລ້ວນໆ, ຍາວ 3-5 ປະໂຫຍກ, ໜ້າສົນໃຈ ແລະ ຊັດເຈນ ໃຫ້ລູກຄ້າເຂົ້າໃຈງ່າຍ. ໃຫ້ກ່າວເຖິງຈຸດເດັ່ນ, ການນຳໃຊ້ ຫຼື ປະໂຫຍດຂອງສິນຄ້າ. ຫ້າມແຕ່ງຂໍ້ມູນສະເພາະ (ເຊັ່ນ: ຂະໜາດ, ວັດສະດຸ, ຈຳນວນ) ທີ່ບໍ່ໄດ້ໃຫ້ໄວ້ຂ້າງລຸ່ມ.\n\nຊື່ສິນຄ້າ: ${nameLo}\nໝວດໝູ່: ${catName||'-'}\nລາຄາ: ${price?fmtMoney(Number(price)):'-'}\n\nຕອບກັບແຕ່ຂໍ້ຄວາມລາຍລະອຽດເທົ່ານັ້ນ, ບໍ່ຕ້ອງມີຄຳນຳ ຫຼື ຫົວຂໍ້.`;
    // gemini-2.5-flash was retired for new/unauthorized projects (404 "no longer available to
    // new users") — switched to gemini-3.6-flash, the current stable/GA Flash model as of Aug
    // 2026. If this breaks again in the future, check https://ai.google.dev/gemini-api/docs/models
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-goog-api-key': key
      },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { maxOutputTokens: 400 }
      })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data?.error?.message || 'API error');
    const text = ((data.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim();
    if(!text) throw new Error('ບໍ່ໄດ້ຮັບຄຳຕອບຈາກ AI');
    overlay.querySelector('#pDesc').value = text;
  }catch(e){
    showToast('ຂຽນລາຍລະອຽດບໍ່ສຳເລັດ: ' + e.message);
  }finally{
    btn.disabled = false; btn.textContent = '🤖 ຂຽນລາຍລະອຽດໃຫ້ອັດຕະໂນມັດ';
  }
}
// reads a video file's duration client-side (no upload needed) so we can reject >10s clips early
function getVideoDuration(file){
  return new Promise((resolve, reject)=>{
    const v = document.createElement('video');
    v.preload = 'metadata';
    v.onloadedmetadata = ()=>{ URL.revokeObjectURL(v.src); resolve(v.duration); };
    v.onerror = ()=> reject(new Error('ອ່ານໄຟລ໌ວິດີໂອບໍ່ໄດ້'));
    v.src = URL.createObjectURL(file);
  });
}

/* ============================================================ SELLERS (KYC approval queue)
   Backend requirements (SQL side, not in this file):
   - sellers table needs: status text ('pending'|'approved'|'rejected'|'suspended') default 'pending',
     full_name, province, district, village, id_card_url, selfie_with_id_url, reject_reason,
     approved_at, auto_approved bool default false.
   - AI KYC check columns on the SAME sellers row (mirrors how ai_status/ai_amount/etc. already
     live directly on wallet_transactions rows for the slip checker, rather than a separate
     table — same pattern here since each application is exactly one sellers row):
     ai_status text ('pending'|'ok'|'issue'), ai_note text, ai_id_name text (OCR'd name off the
     card), ai_id_number text (OCR'd ID number, store masked/partial if possible), ai_face_match_score
     numeric (0-1 likeness between id_card_url and selfie_with_id_url), ai_checked_at timestamptz.
   - A DB trigger on INSERT into sellers should call a new `seller-kyc-ai-check` edge function
     (same shape as the existing slip-ai-check trigger) which reads id_card_url + selfie_with_id_url
     with Gemini vision, OCRs the card, compares the OCR'd name to full_name, compares the two
     faces for a match score, and checks the card isn't expired/cropped/unreadable. If confidence
     is high on every check, the function (service role — NOT the admin_seller_approve RPC, since
     no admin password exists at that point) may set status='approved', approved_at=now(),
     auto_approved=true directly, skipping the manual queue. Otherwise it leaves status='pending'
     with ai_status='issue'|'ok' so the admin can see exactly what the AI found. An admin can
     still suspend an auto-approved seller later via admin_seller_suspend if something looks wrong
     after the fact — auto-approval is a triage shortcut, not a way to bypass admin oversight.
   - seller_application_submit(p_store_name, p_full_name, p_phone, p_email, p_password, p_province,
     p_district, p_village, p_id_card_url, p_selfie_with_id_url, p_withdraw_qr_url, p_terms_accepted):
     INSERTs a seller with status='pending'. Must NOT return a usable session.
   - seller_login(p_identifier, p_password): must only succeed when status='approved'; otherwise raise
     an exception with a human-readable message (e.g. "ບັນຊີກຳລັງລໍຖ້າການກວດສອບ" / "ຄຳຂໍຖືກປະຕິເສດ").
   - admin_list_sellers(p_password): admin-only, returns every seller row above plus id/created_at.
     The row's own `id` doubles as both the "application ID" and the "shop ID" — it's the same
     value used everywhere else (openShop(seller.id), products.seller_id, etc.) and never changes
     across resubmission/approval/suspension, so it's what admin should search/reference if a
     seller needs to be looked up later (rule violations, a customer complaint, etc.).
   - admin_seller_approve(p_password, p_seller_id): sets status='approved', approved_at=now().
   - admin_seller_reject(p_password, p_seller_id, p_reason): sets status='rejected', reject_reason.
   - admin_seller_suspend / admin_seller_reactivate(p_password, p_seller_id): toggles status='suspended'/'approved'
     for a seller who was already approved (e.g. policy violation), without deleting their data.
   - admin_reset_seller_password(p_password, p_seller_id, p_new_password): admin-set password reset.
   - admin_recheck_seller_kyc_ai(p_password, p_seller_id): re-triggers the same Gemini check by
     hand (mirrors admin_recheck_slip_ai) — useful right after setting/rotating the Gemini API key.
   - Storage: khaidee-seller-kyc bucket should be PRIVATE (unlike khaidee-products) since it holds ID
     card photos and face selfies — restrict read access to the admin role via storage RLS. ============================================================ */

// Needs a new admin_delete_topup RPC (SECURITY DEFINER) that just removes the row from the
// topup/wallet-transaction table by id — it does NOT touch the customer's wallet_balance.
// This is for cleaning up clutter (duplicates, rejected junk, test entries), not for reversing
// a topup that was already approved and credited — use adminApproveTopup(id, false) for that
// while it's still pending, since deleting an already-approved row won't claw back the balance.
async function adminDeleteTopup(id){
  const t = (STATE.adminTopupsCache||[]).find(x=>x.id===id);
  const warn = t && t.status==='approved'
    ? 'ລາຍການນີ້ອະນຸມັດແລ້ວ ແລະ ຍອດເງິນໄດ້ເຂົ້າກະເປົາລູກຄ້າໄປແລ້ວ — ການລຶບຈະລຶບແຕ່ປະຫວັດ ຈະບໍ່ຫັກເງິນຄືນ. ຕ້ອງການລຶບແທ້ບໍ?'
    : 'ລຶບຄຳຂໍເຕີມເງິນນີ້?';
  if(!confirm(warn)) return;
  onGuard('topup-delete-'+id, async ()=>{
    try{
      await sbRPC('admin_delete_topup', {p_password:STATE.adminPassword, p_txn_id:id});
      playSuccessSound();
      document.querySelectorAll('.overlay.show').forEach(o=>o.remove());
      renderAdminTopups();
    }catch(e){ playErrorSound(); showToast('ຜິດພາດ: ' + e.message); }
  });
}

/* ============================================================ AI SLIP CHECK (🤖 ຕຣວດສະລິບ AI) ============================================================
   The actual AI reading happens server-side already: a DB trigger fires the moment a customer
   or seller top-up gets a slip_url, which calls the `slip-ai-check` edge function. That function
   reads the slip with Gemini vision, extracts amount/ref-number/date-time/sender/receiver name,
   checks the ref-number against every other top-up on file (both customer + seller tables) to
   catch a re-used slip, compares the amount to what was requested, writes it all onto the
   wallet_transactions / seller_wallet_transactions row (ai_status/ai_note/ai_ref_number/...),
   and pushes an admin notification. It NEVER auto-approves or auto-rejects — this tab is just
   where the admin reads what the AI found and makes the actual call themselves, same buttons as
   the ເຕີມເງິນ/ເຕີມເງິນຜູ້ຂາຍ tabs (adminApproveTopup / adminApproveSellerTopup, reused below). */
function aiSlipStatusPill(s){
  if(s==='ok') return `<span class="status-pill status-approved">✅ ປົກກະຕິ</span>`;
  if(s==='issue') return `<span class="status-pill status-rejected">⚠️ ພົບບັນຫາ</span>`;
  return `<span class="status-pill status-pending">⏳ ຍັງບໍ່ໄດ້ກວດ</span>`;
}

/* ============================================================ SELLER PAYOUTS (withdraw requests) ============================================================
   Needs on the Supabase side:
   - admin_list_seller_withdrawals(p_password) -> [{id, seller_id, store_name, amount, qr_url, status, slip_url, admin_note, requested_at}]
       status: 'pending' | 'approved' | 'rejected'. Seller submits the request + their own payout
       QR (bank/mobile money) from seller.html once they have enough wallet_balance to withdraw.
   - admin_approve_seller_withdrawal(p_password, p_withdrawal_id, p_approve, p_reason?)
       On approve: admin has already paid the seller by scanning their QR — this just deducts the
       amount from seller.wallet_balance and logs a seller_wallet_transactions row (type='withdrawal').
       On reject: just marks the request rejected, wallet_balance untouched.
       admin_approve_withdrawal also now takes p_slip_url (proof-of-transfer photo the admin uploads
       at approval time) so the seller can see confirmation of payment in their withdrawal history.
   All payouts flow through the admin this way — no direct seller-to-customer money movement — same
   principle as the existing customer topup approval flow just mirrored on the seller side. */
async function renderAdminPayouts(){
  const body = document.getElementById('adminBody');
  body.innerHTML = '<div class="loader">ກຳລັງໂຫລດ...</div>';

    onClick:`adminViewPayout(${w.id})`,

      `<span class="dt-amount">${fmtMoney(w.amount)}</span>`,
      `<span class="status-pill status-${w.status}">${w.status}</span>`,
      `<span class="dt-sub">${w.requested_at ? new Date(w.requested_at).toLocaleString('lo-LA') : ''}</span>`
    ]
  }));
  body.innerHTML = dtable(['QR','ຮ້ານຄ້າ','ຈຳນວນ','ສະຖານະ','ວັນທີ'], rows, 'ບໍ່ມີຄຳຂໍຖອນເງິນ');

    ${w.qr_url?`<div class="hint" style="margin-top:10px;">QR ຂອງຮ້ານ (ໂອນຫາອັນນີ້ໃຫ້ຜູ້ຂາຍ):</div><img src="${w.qr_url}" style="width:180px; height:180px; object-fit:cover; border-radius:12px; margin-top:6px; display:block;">`:''}

async function adminApprovePayout(id, approve, btn){
  onGuard('payout-approve-'+id, async ()=>{
    try{
      if(approve){
        const slipFile = document.getElementById('payoutSlipFile')?.files[0];
        if(!slipFile){ showToast('ກະລຸນາອັບໂຫລດຮູບສະລິບການໂອນເງິນກ່ອນອະນຸມັດ'); return; }
        if(btn){ btn.disabled = true; btn.textContent = 'ກຳລັງອັບໂຫລດ...'; }
        const slipUrl = await sbUpload('khaidee-products', `payout_slip_${id}_${Date.now()}_${slipFile.name}`, slipFile);
        await sbRPC('admin_approve_withdrawal', {p_password:STATE.adminPassword, p_id:id, p_slip_url:slipUrl});
      }else{
        await sbRPC('admin_reject_withdrawal', {p_password:STATE.adminPassword, p_id:id, p_reason:''});
      }
      playSuccessSound();
      document.querySelectorAll('.overlay.show').forEach(o=>o.remove());
      renderAdminPayouts();
    }catch(e){ playErrorSound(); showToast('ຜິດພາດ: ' + e.message); if(btn){ btn.disabled=false; btn.textContent='✅ ຈ່າຍແລ້ວ / ອະນຸມັດ'; } }
  });
}

// Auto-generates a short, unique-looking coupon code so the admin never has to type one —
// e.g. "SALE20-K7F2" for a 20%-off coupon, or "FREESHIP-9QX1" for free shipping.
function autoCouponCode(discountType, percent){
  const rand = Math.random().toString(36).slice(2,6).toUpperCase();
  if(discountType==='free_shipping') return `FREESHIP-${rand}`;
  return `SALE${percent||0}-${rand}`;
}
function couponTicketPreviewHtml(discountType, value, expiresAt, code){
  const isFree = discountType==='free_shipping';
  const big = isFree ? '🚚' : `${value||0}%`;
  const label = isFree ? 'ສົ່ງຟຣີ' : 'ສ່ວນຫລຸດ';
  const expTxt = expiresAt ? new Date(expiresAt).toLocaleDateString('lo-LA') : 'ບໍ່ໝົດອາຍຸ';
  return `<div class="coupon-ticket ${isFree?'type-free':''}">
    <div class="ct-main">
      <div class="ct-value">${big}</div>
      <div class="ct-label">${label}${!isFree ? ' ເມື່ອຊື້ສິນຄ້າ' : 'ທົ່ວປະເທດ'}</div>
      ${code?`<div class="ct-sub">ໂຄ້ດ: ${code}</div>`:''}
    </div>
    <div class="ct-stub">
      <div class="ct-icon">${isFree?'📦':'🎟️'}</div>
      <div class="ct-expiry">⏳ ${expTxt}</div>
    </div>
  </div>`;
}

    dtable(['','ໂຄ້ດ','ປະເພດ','ໝົດອາຍຸ','ສະຖານະ',''], rows, 'ຍັງບໍ່ມີຄູປອງ');

function adminEditCoupon(id){
  const cp = id ? (STATE.adminCouponsCache||[]).find(x=>x.id===id) : null;
  let type = cp?.discount_type || 'percent';
  const overlay = document.createElement('div'); overlay.className='overlay show center';
  overlay.innerHTML = `<div class="sheet"><div class="sheet-header"><h3>🎟️ ${id?'ແກ້ໄຂ':'ສ້າງ'}ຄູປອງ</h3><button class="closex" data-close>✕</button></div>
  <div class="sheet-body">
    <div id="cpPreview" style="margin-bottom:14px;"></div>
    <div class="coupon-type-toggle">
      <button type="button" id="cpTypePercentBtn" onclick="cpSetType('percent')">🎟️ ສ່ວນຫລຸດ %</button>
      <button type="button" id="cpTypeFreeBtn" onclick="cpSetType('free_shipping')">🚚 ສົ່ງຟຣີ</button>
    </div>
    <div class="field" id="cpValueField"><label>ສ່ວນຫລຸດ (%)</label><input type="number" id="cpValue" min="1" max="90" value="${cp&&cp.discount_type==='percent'?cp.discount_value:''}" placeholder="ເຊັ່ນ: 20" oninput="cpRepaint()"></div>
    <div class="field"><label>ວັນໝົດອາຍຸ</label><input type="date" id="cpExpire" value="${cp?.expires_at ? cp.expires_at.slice(0,10) : ''}" oninput="cpRepaint()"></div>
    <div class="hint" style="margin:-4px 0 12px;">ລາຍລະອຽດອື່ນໆ (ໂຄ້ດ ແລະ ອື່ນໆ) ຈະຖືກສ້າງໃຫ້ອັດຕະໂນມັດ</div>
    <label style="display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:12px;"><input type="checkbox" id="cpActive" ${!cp||cp.is_active?'checked':''}> ເປີດໃຊ້ງານ</label>
    <button class="btn btn-primary" id="cpSave">ບັນທຶກ</button>
  </div></div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('[data-close]').onclick=()=>overlay.remove();
  window.cpSetType = (t)=>{
    type = t;
    document.getElementById('cpTypePercentBtn').classList.toggle('active', t==='percent');
    document.getElementById('cpTypeFreeBtn').classList.toggle('active', t==='free_shipping');
    document.getElementById('cpValueField').style.display = t==='free_shipping' ? 'none' : 'block';
    cpRepaint();
  };

    const val = Number(document.getElementById('cpValue').value)||0;
    const exp = document.getElementById('cpExpire').value ? document.getElementById('cpExpire').value+'T23:59:59' : null;
    document.getElementById('cpPreview').innerHTML = couponTicketPreviewHtml(type, val, exp);
  };
  cpSetType(type);
  overlay.querySelector('#cpSave').onclick=async()=>{
    const btn = overlay.querySelector('#cpSave'); btn.disabled = true; btn.textContent = 'ກຳລັງບັນທຶກ...';
    const val = Number(document.getElementById('cpValue').value)||0;
    if(type==='percent' && (val<=0||val>=100)){ showToast('ກະລຸນາໃສ່ສ່ວນຫລຸດລະຫວ່າງ 1-99%'); btn.disabled=false; btn.textContent='ບັນທຶກ'; return; }
    try{
      await sbRPC('admin_upsert_coupon', {p_password:STATE.adminPassword, p_coupon:{
        id: id||undefined,
        code: cp?.code || autoCouponCode(type, val),
        discount_type: type,
        discount_value: type==='free_shipping' ? 0 : val,
        min_order: cp?.min_order || 0,
        usage_limit: cp?.usage_limit ?? null,
        expires_at: document.getElementById('cpExpire').value ? document.getElementById('cpExpire').value+'T23:59:59' : null,
        is_active: document.getElementById('cpActive').checked}});
      overlay.remove(); renderAdminCoupons();
    }catch(e){ showToast('ບັນທຶກບໍ່ສຳເລັດ: ' + e.message); btn.disabled=false; btn.textContent='ບັນທຶກ'; }
  };
}

/* ============================================================ RETURNS / REFUNDS ============================================================
   Needs on the Supabase side (see the SQL migration handed to the user separately — this admin
   app only calls these, it can't create them itself):
   - admin_list_returns(p_password) -> [{id, order_id, order_number, customer_name, customer_phone,
       seller_id, store_name, reason, reason_detail, photo_urls, refund_amount, status
       ('pending'|'approved'|'rejected'), admin_note, requested_at, resolved_at}]
   - admin_resolve_return(p_password, p_return_id, p_approve, p_refund_amount, p_restock, p_admin_note)
       On approve: order_returns.status='approved', orders.status='returned', credits
       customers.wallet_balance += p_refund_amount (logs a customer wallet_transactions row,
       type='refund'), and — only if this order's seller had already been paid out for it — debits
       the same amount from sellers.wallet_balance (logs seller_wallet_transactions, type=
       'return_deduction'). If p_restock is true, also adds each returned line item's qty back onto
       products.stock. On reject: order_returns.status='rejected', orders.status reverts to
       'delivered', admin_note stored, nothing financial happens. Same "admin is the only one who
       can pull the trigger on money movement" principle as topups/payouts. */
async function renderAdminReturns(){
  const body = document.getElementById('adminBody');
  body.innerHTML = '<div class="loader">ກຳລັງໂຫລດ...</div>';
  let list = [];
  try{ list = await sbRPC('admin_list_returns', {p_password: STATE.adminPassword}); }
  catch(e){ body.innerHTML = '<div class="empty">ບໍ່ສາມາດໂຫລດຂໍ້ມູນໄດ້ — ຄຸນສົມບັດນີ້ອາດຍັງບໍ່ໄດ້ຕິດຕັ້ງໃນຖານຂໍ້ມູນ (ເບິ່ງ SQL migration)</div>'; return; }
  STATE.adminReturnsCache = list;
  const pendingCount = list.filter(r=>r.status==='pending').length;
  const statusLbl = {pending:'ລໍຖ້າ', approved:'ອະນຸມັດແລ້ວ', rejected:'ຖືກປະຕິເສດ'};
  const rows = list.map(r=>({
    onClick:`adminViewReturn(${r.id})`,
    cells:[
      `<span class="dt-title">#${r.order_number}</span><span class="dt-sub">${r.store_name||'-'}</span>`,
      `<span class="dt-sub">${r.customer_name||''} ${r.customer_phone?'• '+r.customer_phone:''}</span>`,
      `<span class="dt-sub">${r.reason}</span>`,
      `<span class="dt-amount">${fmtMoney(r.refund_amount)}</span>`,
      `<span class="status-pill status-${r.status}">${statusLbl[r.status]||r.status}</span>`,
      `<span class="dt-sub">${new Date(r.requested_at).toLocaleString('lo-LA')}</span>`
    ]
  }));
  body.innerHTML = `
    ${pendingCount ? `<div class="hint" style="margin-bottom:12px; background:var(--gold-light); padding:10px 12px; border-radius:10px; font-weight:700; color:var(--maroon-dark);">🔔 ມີ ${pendingCount} ຄຳຂໍລໍຖ້າກວດສອບ</div>` : ''}
    ${dtable(['ອໍເດີ','ລູກຄ້າ','ເຫດຜົນ','ຈຳນວນຄືນ','ສະຖານະ','ວັນທີ'], rows, 'ຍັງບໍ່ມີການຂໍຄືນສິນຄ້າ')}`;
}
function adminViewReturn(id){
  const r = (STATE.adminReturnsCache||[]).find(x=>x.id===id);
  if(!r) return;
  const overlay = document.createElement('div'); overlay.className='overlay show center';
  overlay.innerHTML = `<div class="sheet"><div class="sheet-header"><h3>🔄 ຄຳຂໍຄືນສິນຄ້າ</h3><button class="closex" data-close>✕</button></div>
  <div class="sheet-body">
    <div class="top" style="margin-bottom:6px;"><span class="title">#${r.order_number} • ${r.store_name||'-'}</span><span class="status-pill status-${r.status}">${({pending:'ລໍຖ້າ', approved:'ອະນຸມັດແລ້ວ', rejected:'ຖືກປະຕິເສດ'})[r.status]||r.status}</span></div>
    <div class="hint">${r.customer_name||''} ${r.customer_phone?'• '+r.customer_phone:''}</div>
    <div class="hint">${new Date(r.requested_at).toLocaleString('lo-LA')}</div>
    <div class="hint" style="margin-top:10px; font-weight:700; color:var(--ink);">ເຫດຜົນ: ${r.reason}</div>
    ${r.reason_detail?`<div class="hint" style="margin-top:2px;">${r.reason_detail}</div>`:''}
    ${(r.photo_urls||[]).length ? `<div style="display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;">${r.photo_urls.map(u=>`<img src="${u}" onclick="window.open('${u}','_blank')" style="width:64px; height:64px; object-fit:cover; border-radius:8px; cursor:pointer; border:1px solid var(--line);">`).join('')}</div>` : '<div class="hint" style="margin-top:6px;">ບໍ່ມີຮູບຫຼັກຖານ</div>'}
    ${r.video_url ? `<video src="${r.video_url}" controls style="width:180px; height:100px; border-radius:8px; margin-top:8px; display:block;"></video>` : ''}
    ${r.status==='pending' ? `
    <div class="field" style="margin-top:16px;"><label>ຈຳນວນເງິນທີ່ຈະຄືນ</label><input type="number" id="retAmount" value="${r.refund_amount}"></div>
    <label style="display:flex; align-items:center; gap:8px; font-size:12.5px; margin:8px 0;"><input type="checkbox" id="retRestock" style="width:auto;"> ➕ ຄືນສະຕັອກສິນຄ້າ (ຖ້າສິນຄ້າຍັງຂາຍໄດ້)</label>
    <div class="field"><label>ໝາຍເຫດ (ບໍ່ບັງຄັບ)</label><textarea id="retNote" rows="2" placeholder="ໝາຍເຫດ..."></textarea></div>
    <div class="chiprow" style="margin-top:8px;"><button onclick="adminResolveReturn(${r.id},true)" style="color:var(--ok);">✅ ອະນຸມັດ ແລະ ຄືນເງິນ</button><button onclick="adminResolveReturn(${r.id},false)" style="color:var(--danger);">❌ ປະຕິເສດ</button></div>`
    : `${r.admin_note?`<div class="hint" style="margin-top:12px;">📝 ໝາຍເຫດແອດມິນ: ${r.admin_note}</div>`:''}
       ${r.status==='approved'?`<div class="hint" style="margin-top:4px; font-weight:700; color:var(--ok);">ຄືນເງິນ: ${fmtMoney(r.refund_amount)}</div>`:''}`}
  </div></div>`;
  document.body.appendChild(overlay);

/* ============================================================ PUSH NOTIFICATIONS (sound + vibration for new orders, topup requests,
   and AI slip-check flags — works even when the admin app/tab is closed, via Web Push + a
   service worker. Same pattern/backend as seller.html's push toggle, just admin_* RPCs and the
   admin-push-notify edge function instead of the seller ones. ============================================================ */
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
function pushSupported(){
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}
async function refreshPushToggleUI(){
  const btn = document.getElementById('pushToggleBtn');
  const hint = document.getElementById('pushStatusHint');
  if(!btn) return;
  if(!pushSupported()){
    btn.textContent = '🔕 ອຸປະກອນນີ້ບໍ່ຮອງຮັບການແຈ້ງເຕືອນ';
    btn.disabled = true;
    if(hint) hint.textContent = 'ລອງເປີດຜ່ານ Chrome (Android) ຫຼືເພີ່ມແອັບໄປໜ້າຈໍຫຼັກກ່ອນ (iPhone, iOS 16.4+)';
    return;
  }
  let isOn = false;
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    isOn = !!sub && Notification.permission === 'granted';
  }catch(e){ /* ignore */ }
  btn.textContent = isOn ? '🔕 ປິດການແຈ້ງເຕືອນສຽງ' : '🔔 ເປີດການແຈ້ງເຕືອນສຽງ';
  btn.className = isOn ? 'btn btn-ghost' : 'btn btn-gold';
  btn.disabled = false;
  if(hint) hint.textContent = isOn
    ? '✅ ເປີດຢູ່ — ອຸປະກອນນີ້ຈະມີສຽງ+ສັ່ນທັນທີທີ່ມີອໍເດີໃໝ່/ຄຳຂໍເຕີມເງິນ/ສະລິບມີບັນຫາ ເຖິງແມ່ນປິດແອັບໄວ້'
    : 'ຍັງບໍ່ໄດ້ເປີດ — ຈະບໍ່ໄດ້ຍິນສຽງແຈ້ງເຕືອນຕອນປິດແອັບຖ້າຍັງບໍ່ກົດເປີດ';
}
async function togglePushNotifications(){
  const btn = document.getElementById('pushToggleBtn');
  if(!pushSupported()){ showToast('ອຸປະກອນ ຫຼື ບຣາວເຊີນີ້ບໍ່ຮອງຮັບການແຈ້ງເຕືອນ'); return; }
  if(btn) btn.disabled = true;
  try{
    // iOS Safari requires the permission prompt to be the very first awaited call here (see
    // seller.html's identical note) or every later push call fails silently.
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){
      showToast('ກະລຸນາອະນຸຍາດການແຈ້ງເຕືອນຈາກບຣາວເຊີ/ໂທລະສັບເພື່ອເປີດໃຊ້');
      return;
    }
    const swReg = await registerSw();
    if(!swReg){ showToast('ຕິດຕັ້ງລະບົບແຈ້ງເຕືອນບໍ່ສຳເລັດ'); return; }
    const reg = await navigator.serviceWorker.ready;
    const existing = await reg.pushManager.getSubscription();
    if(existing){
      await sbRPC('admin_remove_push_subscription', {p_password: STATE.adminPassword, p_endpoint: existing.endpoint}).catch(()=>{});
      await existing.unsubscribe();
      showToast('ປິດການແຈ້ງເຕືອນສຽງແລ້ວ');
    }else{
      const vapidKey = await sbRPC('get_vapid_public_key', {});
      let sub;
      try{
        sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(vapidKey) });
      }catch(subErr){
        await new Promise(r=>setTimeout(r, 1200));
        sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(vapidKey) });
      }
      const j = sub.toJSON();
      await sbRPC('admin_save_push_subscription', {
        p_password: STATE.adminPassword, p_endpoint: j.endpoint,
        p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_user_agent: navigator.userAgent
      });
      showToast('🔔 ເປີດການແຈ້ງເຕືອນສຽງແລ້ວ!');
    }
  }catch(e){
    const msg = /internal service error|AbortError/i.test(e.message||'')
      ? 'ບໍ່ສາມາດເປີດການແຈ້ງເຕືອນໄດ້ຕອນນີ້ (ບັນຫາຈາກລະບົບ Push ຂອງບຣາວເຊີ/ໂທລະສັບ) — ລອງປິດ-ເປີດ WiFi ໃໝ່ ຫຼືລອງອີກຄັ້ງ'
      : 'ມີບັນຫາ: ' + e.message;
    showToast(msg);
  }
  finally{ refreshPushToggleUI(); }
}

async function registerSw(){
  if(!('serviceWorker' in navigator)) return null;
  try{ return await navigator.serviceWorker.register('sw.js'); }
  catch(e){ console.warn('sw register failed', e); return null; }
}
(async function init(){
  const splashStart = Date.now();

  setTimeout(async ()=>{
    const splash = document.getElementById('splashScreen');
    if(splash){ splash.classList.add('fade-out'); setTimeout(()=>splash.remove(), 550); }
    if(STATE.adminPassword){
      // Silently re-verify the remembered password still works before trusting it — if the
      // admin password was changed elsewhere (or this is stale/tampered localStorage), fall
      // back to the login screen instead of a broken "logged in but every call 403s" state.
      try{
        const ok = await sbRPC('admin_verify', {p_password: STATE.adminPassword});
        if(ok){ await enterAdmin(); return; }
      }catch(e){ /* fall through to login screen */ }
      STATE.adminPassword = null; localStorage.removeItem('kd_admin_pw');
    }
    document.getElementById('loginScreen').style.display = 'flex';
  }, Math.max(0, 900 - elapsed));
})();
if('serviceWorker' in navigator){

}

  window.addEventListener('appinstalled', ()=>{ hideModal(); hideChip(); });
  function hideModal(){ modal.classList.remove('show'); }

  function contentFor(platform){
    if(platform==='ios'){
      return `
        <div class="it-icon">📲</div>
        <h3>ຕິດຕັ້ງແອັບ KhaiDee Admin</h3>
        <div class="it-sub">ເຂົ້າຄວບຄຸມລະບົບໄດ້ໄວຂຶ້ນ ເໝືອນແອັບຈິງ ບໍ່ຕ້ອງເປີດ Safari ອີກ</div>
        <div class="step"><div class="num">1</div><div class="txt">ກົດປຸ່ມ <b>ແບ່ງປັນ (Share)</b> <span class="share-ico">⬆️</span> ທາງລຸ່ມຂອງໜ້າຈໍ Safari</div></div>
        <div class="step"><div class="num">2</div><div class="txt">ເລື່ອນລົງ ແລະ ເລືອກ <b>"ເພີ່ມໄປໜ້າຈໍຫຼັກ"</b> (Add to Home Screen)</div></div>
        <div class="step"><div class="num">3</div><div class="txt">ກົດ <b>"ເພີ່ມ"</b> (Add) ຢູ່ມຸມຂວາເທິງ — ໄອຄອນແອັບຈະປາກົດຢູ່ໜ້າຈໍຫຼັກທັນທີ</div></div>
        <button class="it-primary" id="itPrimaryBtn" onclick="document.getElementById('installTutorial').classList.remove('show')">ເຂົ້າໃຈແລ້ວ</button>
        <div class="it-neveragain"><input type="checkbox" id="itNeverAgain"><label for="itNeverAgain">ບໍ່ຕ້ອງເຕືອນອີກ</label></div>`;
    }
    if(platform==='android'){
      return `
        <div class="it-icon">📲</div>
        <h3>ຕິດຕັ້ງແອັບ KhaiDee Admin</h3>
        <div class="it-sub">ເຂົ້າຄວບຄຸມລະບົບໄດ້ໄວຂຶ້ນ ເໝືອນແອັບຈິງ ບໍ່ຕ້ອງເປີດເບຣົາເຊີອີກ</div>
        <div class="step"><div class="num">1</div><div class="txt">ກົດປຸ່ມສີຄຳລຸ່ມນີ້ — ລະບົບຈະຖາມວ່າ "ຕິດຕັ້ງແອັບບໍ?"</div></div>
        <div class="step"><div class="num">2</div><div class="txt">ຖ້າບໍ່ຂຶ້ນອັດຕະໂນມັດ: ກົດ <b>⋮ ເມນູ 3 ຈຸດ</b> <span class="dots-ico">⋮</span> ມຸມຂວາເທິງ Chrome</div></div>
        <div class="step"><div class="num">3</div><div class="txt">ເລືອກ <b>"ຕິດຕັ້ງແອັບ"</b> ຫຼື <b>"ເພີ່ມໄປໜ້າຈໍຫຼັກ"</b></div></div>
        <button class="it-primary" id="itPrimaryBtn">ຕິດຕັ້ງແອັບ</button>
        <div class="it-neveragain"><input type="checkbox" id="itNeverAgain"><label for="itNeverAgain">ບໍ່ຕ້ອງເຕືອນອີກ</label></div>`;
    }
    return `
      <div class="it-icon">📲</div>
      <h3>ຕິດຕັ້ງແອັບ KhaiDee Admin</h3>
      <div class="it-sub">ເປີດລິ້ງນີ້ໃນມືຖື (Chrome ຫຼື Safari) ເພື່ອຕິດຕັ້ງເປັນແອັບ</div>
      <div class="step"><div class="num">1</div><div class="txt">ຖ້າໃຊ້ຄອມພິວເຕີ Chrome: ກົດໄອຄອນ <b>⊕ ຕິດຕັ້ງ</b> ຢູ່ໃນຊ່ອງທີ່ຢູ່ URL</div></div>
      <div class="step"><div class="num">2</div><div class="txt">ຫຼືເປີດລິ້ງນີ້ອີກຄັ້ງດ້ວຍມືຖືເພື່ອຮັບຄຳແນະນຳສະເພາະສຳລັບອຸປະກອນນັ້ນ</div></div>
      <button class="it-primary" id="itPrimaryBtn" onclick="document.getElementById('installTutorial').classList.remove('show')">ເຂົ້າໃຈແລ້ວ</button>
      <div class="it-neveragain"><input type="checkbox" id="itNeverAgain"><label for="itNeverAgain">ບໍ່ຕ້ອງເຕືອນອີກ</label></div>`;
  }

  const platform = isIOS ? 'ios' : (isChromeAndroid || isAndroid ? 'android' : 'other');

  function showModal(){
    sheet.innerHTML = contentFor(platform);
    modal.classList.add('show');
    const btn = document.getElementById('itPrimaryBtn');
    const neverAgain = document.getElementById('itNeverAgain');
    if(platform==='android' && btn){
      btn.onclick = async ()=>{
        if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; }
        modal.classList.remove('show');
      };
    }
    modal.onclick = (e)=>{ if(e.target===modal) closeModal(); };
    function closeModal(){
      modal.classList.remove('show');
      if(neverAgain && neverAgain.checked){ localStorage.setItem('kda_install_never', '1'); hideChip(); }
      else{ localStorage.setItem('kda_install_last_shown', String(Date.now())); showChip(); }
    }
    if(platform!=='android' && btn){
      btn.addEventListener('click', ()=>{
        if(neverAgain && neverAgain.checked){ localStorage.setItem('kda_install_never', '1'); hideChip(); }
        else{ localStorage.setItem('kda_install_last_shown', String(Date.now())); showChip(); }
      });
    }
  }

  function showChip(){ if(localStorage.getItem('kda_install_never')!=='1') chip.classList.add('show'); }
  function hideChip(){ chip.classList.remove('show'); }
  chip.onclick = showModal;

  const neverAgainFlag = localStorage.getItem('kda_install_never')==='1';
  const lastShown = Number(localStorage.getItem('kda_install_last_shown')||0);
  const shownRecently = lastShown && (Date.now() - lastShown < 24*60*60*1000);

  if(neverAgainFlag){ setTimeout(showChip, 1500); }
  else if(shownRecently){ setTimeout(showChip, 1500); }
  else{ setTimeout(showModal, 1500); }
})();
</script>
</body>
</html>

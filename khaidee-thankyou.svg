  <text x="320" y="415" text-anchor="middle" font-family="'Noto Sans Lao','Phetsarath OT','Saysettha OT','Noto Sans',sans-serif" font-size="28" font-weight="600" fill="#5A1420">ທີ່ໃຊ້ບໍລິການ</text>


    <rect x="-58" y="-10" width="116" height="110" rx="10" fill="url(#bag)"/>
    <path d="M-24 -58 Q0 -96 24 -58" fill="none" stroke="#7A1E2B" stroke-width="9" stroke-linecap="round"/>

  </linearGradient>
  <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#9C2A3A"/>
    <stop offset="100%" stop-color="#7A1E2B"/>
  </linearGradient>
  <clipPath id="cardClip"><rect x="0" y="0" width="640" height="770" rx="36"/></clipPath>

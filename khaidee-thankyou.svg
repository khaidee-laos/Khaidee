<svg width="640" height="770" viewBox="0 0 640 770" xmlns="http://www.w3.org/2000/svg" role="img">
<title>ຂອບໃຈທີ່ໃຊ້ບໍລິການ ຂາຍດີ Marketplace</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FBF6EC"/>
    <stop offset="55%" stop-color="#F6E9C9"/>
    <stop offset="100%" stop-color="#F1DFAE"/>
  </linearGradient>
  <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
